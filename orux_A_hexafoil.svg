<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 280 80" width="280" height="80">
  <defs>
    <linearGradient id="silverA" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#FFFFFF"/>
      <stop offset="45%" stop-color="#C8C8CC"/>
      <stop offset="100%" stop-color="#6E6E72"/>
    </linearGradient>
  </defs>
  <!-- Mark: six interlocking lenses rotating 60° each — 6-fold rotational symmetry -->
  <g transform="translate(40,40)" fill="none" stroke="url(#silverA)" stroke-width="2.2" stroke-linejoin="round">
    <g>
      <path d="M0 -22 Q12 -8 0 0 Q-12 -8 0 -22 Z"/>
    </g>
    <g transform="rotate(60)">
      <path d="M0 -22 Q12 -8 0 0 Q-12 -8 0 -22 Z"/>
    </g>
    <g transform="rotate(120)">
      <path d="M0 -22 Q12 -8 0 0 Q-12 -8 0 -22 Z"/>
    </g>
    <g transform="rotate(180)">
      <path d="M0 -22 Q12 -8 0 0 Q-12 -8 0 -22 Z"/>
    </g>
    <g transform="rotate(240)">
      <path d="M0 -22 Q12 -8 0 0 Q-12 -8 0 -22 Z"/>
    </g>
    <g transform="rotate(300)">
      <path d="M0 -22 Q12 -8 0 0 Q-12 -8 0 -22 Z"/>
    </g>
    <circle cx="0" cy="0" r="2.5" fill="url(#silverA)" stroke="none"/>
  </g>
  <text x="84" y="51" font-family="'Inter','SF Pro Display','Helvetica Neue',Arial,sans-serif" font-size="34" font-weight="600" letter-spacing="-1.5" fill="url(#silverA)">orux</text>
</svg>
