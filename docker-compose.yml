# Despliegue real de orux: el server Python detrás de Caddy.
#
# Caddy es lo ÚNICO expuesto a internet (80/443): sirve el cliente estático,
# termina TLS automático (Let's Encrypt si hay dominio real) y proxya el
# WebSocket al server. El server `orux` no publica puertos: solo es
# alcanzable dentro de la red de compose. El estado vive en un volumen, así
# sobrevive a recrear los contenedores.
services:
  orux:
    # Endurecimiento: ningún proceso del contenedor puede ganar privilegios
    # vía binarios setuid (no los necesita). Aplica a los 4 servicios.
    security_opt: ["no-new-privileges:true"]
    build: .
    restart: unless-stopped
    depends_on:
      - postgres
    expose:
      - "8765"          # solo dentro de la red de compose, no al host
    # Topes de recursos calibrados al VPS de 4vCPU/8GB. orux es el más
    # pesado del cuarteto: arranca pyright/tsserver/gopls/rust-analyzer
    # como subprocesos (~500-800 MB cada uno cuando indexan un repo
    # grande). 4 GB dan margen para los 4 LSP simultáneos + event loop
    # + locks + buffers. 3 CPU permite que LSP+broadcasts no se peleen.
    # `docker compose up` respeta esto sin necesitar swarm.
    deploy:
      resources:
        limits:
          cpus: '3.0'
          memory: 4G
        reservations:
          memory: 512M
    environment:
      # Capa 15: DSN de Postgres. La password viene del .env (POSTGRES_PASSWORD)
      # — antes estaba hardcodeada como `orux` en este archivo (BACKEND-AUDIT
      # H-02): privado, pero un secreto compartido en el repo no debería
      # rotarse editando un archivo commiteable. La sintaxis `${...:?msg}`
      # hace que `docker compose up` FALLE rápido si la var no está, en vez
      # de arrancar con un default inseguro.
      - "ORUX_DB_DSN=postgresql://orux:${POSTGRES_PASSWORD:?POSTGRES_PASSWORD requerido en .env, generar con openssl rand -hex 24}@postgres:5432/orux"
      # MISMO secreto que el contenedor `api`: el server WS verifica los
      # tokens de sesión que el callback OAuth firma. Vacío = OAuth
      # deshabilitado y el server usa su archivo ~/.orux/secret (igual
      # que siempre). Generá uno fuerte: `openssl rand -hex 32`.
      - ORUX_SESSION_SECRET=${ORUX_SESSION_SECRET:-}
      # Capa 31 (cobro POR ASIENTO): la MISMA STRIPE_SECRET_KEY que el
      # contenedor `api`. Con ella, cuando entra un miembro nuevo a un
      # equipo premium, este server ajusta la cantidad de asientos de la
      # suscripción en Stripe. Vacía = el ajuste se omite (billing sin
      # configurar): no rompe nada.
      - STRIPE_SECRET_KEY=${STRIPE_SECRET_KEY:-}
    volumes:
      - orux-data:/data

  api:
    # Capa 23: API interna de OPERADOR, DESACOPLADA — su propio contenedor
    # (misma imagen, otro comando). No comparte el loop ni el estado del
    # server WS: opera solo sobre Postgres (datos durables). Un fallo acá
    # NO toca la colaboración. No publica puertos (Caddy lo proxya en
    # /api). Auth por CUENTA: ORUX_ADMIN_USER (el usuario operador) +
    # ORUX_ADMIN_TOKEN (secreto de FIRMA, nunca sale del server) vienen
    # del host; sin cualquiera la consola queda cerrada (503).
    build: .
    restart: unless-stopped
    depends_on:
      - postgres
    security_opt: ["no-new-privileges:true"]
    command: ["uvicorn", "orux.api.app:app",
              "--host", "0.0.0.0", "--port", "8800"]
    expose:
      - "8800"
    # API HTTP liviana (Starlette + uvicorn). En picos hace POST a Stripe
    # checkout y webhooks de vuelta — 768M le da margen para el JSON
    # blob de eventos sin estresarse.
    deploy:
      resources:
        limits:
          cpus: '0.5'
          memory: 768M
        reservations:
          memory: 128M
    environment:
      # Misma password del .env que el contenedor `orux` (un único secreto).
      - "ORUX_DB_DSN=postgresql://orux:${POSTGRES_PASSWORD:?POSTGRES_PASSWORD requerido en .env}@postgres:5432/orux"
      - ORUX_ADMIN_USER=${ORUX_ADMIN_USER:-}
      - ORUX_ADMIN_TOKEN=${ORUX_ADMIN_TOKEN:-}
      # GitHub OAuth (cerrado por defecto: faltando cualquiera, /oauth/* da
      # 503). ORUX_SESSION_SECRET DEBE ser idéntico al del servicio
      # `orux`. El callback registrado en la OAuth App de GitHub tiene que
      # ser EXACTAMENTE ORUX_OAUTH_REDIRECT.
      - ORUX_SESSION_SECRET=${ORUX_SESSION_SECRET:-}
      - ORUX_GITHUB_CLIENT_ID=${ORUX_GITHUB_CLIENT_ID:-}
      - ORUX_GITHUB_CLIENT_SECRET=${ORUX_GITHUB_CLIENT_SECRET:-}
      - ORUX_OAUTH_REDIRECT=${ORUX_OAUTH_REDIRECT:-}
      - ORUX_APP_URL=${ORUX_APP_URL:-/app/}
      # Stripe (cobro de la suscripción Premium). Cerrado por defecto: si
      # falta cualquiera de las 3 primeras, /api/v1/billing/* da 503 y el
      # botón de upgrade no hace nada. Ver .env.example para de dónde sale
      # cada credencial. STRIPE_PRICE_* tienen default de prueba (10 MXN).
      - STRIPE_SECRET_KEY=${STRIPE_SECRET_KEY:-}
      - STRIPE_WEBHOOK_SECRET=${STRIPE_WEBHOOK_SECRET:-}
      - ORUX_PUBLIC_URL=${ORUX_PUBLIC_URL:-}
      - STRIPE_PRICE_AMOUNT=${STRIPE_PRICE_AMOUNT:-1000}
      - STRIPE_PRICE_CURRENCY=${STRIPE_PRICE_CURRENCY:-mxn}
      - STRIPE_PRICE_INTERVAL=${STRIPE_PRICE_INTERVAL:-month}
      - STRIPE_PRICE_NAME=${STRIPE_PRICE_NAME:-Orux Premium}
    # /api/v1/health no requiere token (capa 23): healthcheck honesto.
    # `curl` ya está en la imagen (capa 20). Unhealthy -> Docker reinicia.
    healthcheck:
      test: ["CMD-SHELL",
             "curl -fsS http://localhost:8800/api/v1/health || exit 1"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 10s

  postgres:
    # Capa 15: la DB de metadatos (users/teams/members/invites/ownership).
    # No publica puertos: sólo alcanzable dentro de la red de compose, como
    # el server. El estado vive en su propio volumen (durabilidad real).
    image: postgres:16-alpine
    security_opt: ["no-new-privileges:true"]
    restart: unless-stopped
    # Postgres solo guarda metadatos (no archivos): tablas chicas, queries
    # cortas. 1.5G permite un shared_buffers más generoso (mejor cache hit
    # ratio) y aguanta picos de signup/login concurrentes en lanzamiento.
    deploy:
      resources:
        limits:
          cpus: '1.0'
          memory: 1500M
        reservations:
          memory: 384M
    environment:
      - POSTGRES_USER=orux
      # BACKEND-AUDIT H-02 (fix): la password viene del .env, no del repo.
      # `:?msg` corta el `docker compose up` con un error legible si la
      # var no está, así no arranca Postgres con una password por defecto
      # inadvertida (que después rotar significaría editar el compose y
      # commitear el reemplazo).
      - "POSTGRES_PASSWORD=${POSTGRES_PASSWORD:?POSTGRES_PASSWORD requerido en .env, generar con openssl rand -hex 24}"
      - POSTGRES_DB=orux
    volumes:
      - orux-pg:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U orux -d orux"]
      interval: 10s
      timeout: 5s
      retries: 5

  caddy:
    # Antes: image caddy:2 + bind-mount de web/ (cliente vanilla crudo).
    # Ahora el cliente es React con build: imagen multi-stage (Node compila
    # -> Caddy sirve dist/). El Caddyfile sigue por bind-mount (edición +
    # sustitución de la variable de dominio).
    build:
      context: .
      dockerfile: Dockerfile.web
    restart: unless-stopped
    security_opt: ["no-new-privileges:true"]
    depends_on:
      - orux
      - api
    ports:
      - "80:80"
      - "443:443"
    # Caddy sirve estáticos + proxy + TLS. En el primer pico de promo es
    # la cara que más req/s ve (cada visitante a la landing pasa por acá);
    # 0.5 CPU le da margen para encode zstd/gzip sin pelearse con orux.
    deploy:
      resources:
        limits:
          cpus: '0.5'
          memory: 256M
        reservations:
          memory: 64M
    environment:
      # Dominio real -> TLS automático. Sin dominio queda "localhost" (cert
      # local, el navegador avisa: ok para probar, no para producción real).
      - ORUX_SITE_ADDRESS=${ORUX_SITE_ADDRESS:-localhost}
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy-data:/data       # certificados
      - caddy-config:/config

volumes:
  orux-data:
  orux-pg:
  caddy-data:
  caddy-config:
