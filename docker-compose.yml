# Despliegue real de laidea: el server Python detrás de Caddy.
#
# Caddy es lo ÚNICO expuesto a internet (80/443): sirve el cliente estático,
# termina TLS automático (Let's Encrypt si hay dominio real) y proxya el
# WebSocket al server. El server `laidea` no publica puertos: solo es
# alcanzable dentro de la red de compose. El estado vive en un volumen, así
# sobrevive a recrear los contenedores.
services:
  laidea:
    build: .
    restart: unless-stopped
    depends_on:
      - postgres
    expose:
      - "8765"          # solo dentro de la red de compose, no al host
    environment:
      # Capa 15: DSN de Postgres. Mientras el server no esté cableado a la
      # DB (eso es el paso 3), aunque esté seteado no cambia el runtime: el
      # adaptador sólo se usa cuando el server lo adopte. Vacío = JSON/memoria.
      - LAIDEA_DB_DSN=postgresql://laidea:laidea@postgres:5432/laidea
    volumes:
      - laidea-data:/data

  postgres:
    # Capa 15: la DB de metadatos (users/teams/members/invites/ownership).
    # No publica puertos: sólo alcanzable dentro de la red de compose, como
    # el server. El estado vive en su propio volumen (durabilidad real).
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      - POSTGRES_USER=laidea
      - POSTGRES_PASSWORD=laidea
      - POSTGRES_DB=laidea
    volumes:
      - laidea-pg:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U laidea -d laidea"]
      interval: 10s
      timeout: 5s
      retries: 5

  caddy:
    # Antes: image caddy:2 + bind-mount de web/ (cliente vanilla crudo).
    # Ahora el cliente es React con build: imagen multi-stage (Node compila
    # -> Caddy sirve dist/). El Caddyfile sigue por bind-mount (edición +
    # sustitución de la variable de dominio).
    build:
      context: .
      dockerfile: Dockerfile.web
    restart: unless-stopped
    depends_on:
      - laidea
    ports:
      - "80:80"
      - "443:443"
    environment:
      # Dominio real -> TLS automático. Sin dominio queda "localhost" (cert
      # local, el navegador avisa: ok para probar, no para producción real).
      - LAIDEA_SITE_ADDRESS=${LAIDEA_SITE_ADDRESS:-localhost}
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy-data:/data       # certificados
      - caddy-config:/config

volumes:
  laidea-data:
  laidea-pg:
  caddy-data:
  caddy-config:
