# Despliegue real de orux: el server Python detrás de Caddy.
#
# Caddy es lo ÚNICO expuesto a internet (80/443): sirve el cliente estático,
# termina TLS automático (Let's Encrypt si hay dominio real) y proxya el
# WebSocket al server. El server `orux` no publica puertos: solo es
# alcanzable dentro de la red de compose. El estado vive en un volumen, así
# sobrevive a recrear los contenedores.
services:
  orux:
    build: .
    restart: unless-stopped
    depends_on:
      - postgres
    expose:
      - "8765"          # solo dentro de la red de compose, no al host
    environment:
      # Capa 15: DSN de Postgres. Mientras el server no esté cableado a la
      # DB (eso es el paso 3), aunque esté seteado no cambia el runtime: el
      # adaptador sólo se usa cuando el server lo adopte. Vacío = JSON/memoria.
      - ORUX_DB_DSN=postgresql://orux:orux@postgres:5432/orux
      # MISMO secreto que el contenedor `api`: el server WS verifica los
      # tokens de sesión que el callback OAuth firma. Vacío = OAuth
      # deshabilitado y el server usa su archivo ~/.orux/secret (igual
      # que siempre). Generá uno fuerte: `openssl rand -hex 32`.
      - ORUX_SESSION_SECRET=${ORUX_SESSION_SECRET:-}
    volumes:
      - orux-data:/data

  api:
    # Capa 23: API interna de OPERADOR, DESACOPLADA — su propio contenedor
    # (misma imagen, otro comando). No comparte el loop ni el estado del
    # server WS: opera solo sobre Postgres (datos durables). Un fallo acá
    # NO toca la colaboración. No publica puertos (Caddy lo proxya en
    # /api). Auth por CUENTA: ORUX_ADMIN_USER (el usuario operador) +
    # ORUX_ADMIN_TOKEN (secreto de FIRMA, nunca sale del server) vienen
    # del host; sin cualquiera la consola queda cerrada (503).
    build: .
    restart: unless-stopped
    depends_on:
      - postgres
    command: ["uvicorn", "orux.api.app:app",
              "--host", "0.0.0.0", "--port", "8800"]
    expose:
      - "8800"
    environment:
      - ORUX_DB_DSN=postgresql://orux:orux@postgres:5432/orux
      - ORUX_ADMIN_USER=${ORUX_ADMIN_USER:-}
      - ORUX_ADMIN_TOKEN=${ORUX_ADMIN_TOKEN:-}
      # GitHub OAuth (cerrado por defecto: faltando cualquiera, /oauth/* da
      # 503). ORUX_SESSION_SECRET DEBE ser idéntico al del servicio
      # `orux`. El callback registrado en la OAuth App de GitHub tiene que
      # ser EXACTAMENTE ORUX_OAUTH_REDIRECT.
      - ORUX_SESSION_SECRET=${ORUX_SESSION_SECRET:-}
      - ORUX_GITHUB_CLIENT_ID=${ORUX_GITHUB_CLIENT_ID:-}
      - ORUX_GITHUB_CLIENT_SECRET=${ORUX_GITHUB_CLIENT_SECRET:-}
      - ORUX_OAUTH_REDIRECT=${ORUX_OAUTH_REDIRECT:-}
      - ORUX_APP_URL=${ORUX_APP_URL:-/app/}
      # Stripe (cobro de la suscripción Premium). Cerrado por defecto: si
      # falta cualquiera de las 3 primeras, /api/v1/billing/* da 503 y el
      # botón de upgrade no hace nada. Ver .env.example para de dónde sale
      # cada credencial. STRIPE_PRICE_* tienen default de prueba (10 MXN).
      - STRIPE_SECRET_KEY=${STRIPE_SECRET_KEY:-}
      - STRIPE_WEBHOOK_SECRET=${STRIPE_WEBHOOK_SECRET:-}
      - ORUX_PUBLIC_URL=${ORUX_PUBLIC_URL:-}
      - STRIPE_PRICE_AMOUNT=${STRIPE_PRICE_AMOUNT:-1000}
      - STRIPE_PRICE_CURRENCY=${STRIPE_PRICE_CURRENCY:-mxn}
      - STRIPE_PRICE_INTERVAL=${STRIPE_PRICE_INTERVAL:-month}
      - STRIPE_PRICE_NAME=${STRIPE_PRICE_NAME:-Orux Premium}
    # /api/v1/health no requiere token (capa 23): healthcheck honesto.
    # `curl` ya está en la imagen (capa 20). Unhealthy -> Docker reinicia.
    healthcheck:
      test: ["CMD-SHELL",
             "curl -fsS http://localhost:8800/api/v1/health || exit 1"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 10s

  postgres:
    # Capa 15: la DB de metadatos (users/teams/members/invites/ownership).
    # No publica puertos: sólo alcanzable dentro de la red de compose, como
    # el server. El estado vive en su propio volumen (durabilidad real).
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      - POSTGRES_USER=orux
      - POSTGRES_PASSWORD=orux
      - POSTGRES_DB=orux
    volumes:
      - orux-pg:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U orux -d orux"]
      interval: 10s
      timeout: 5s
      retries: 5

  caddy:
    # Antes: image caddy:2 + bind-mount de web/ (cliente vanilla crudo).
    # Ahora el cliente es React con build: imagen multi-stage (Node compila
    # -> Caddy sirve dist/). El Caddyfile sigue por bind-mount (edición +
    # sustitución de la variable de dominio).
    build:
      context: .
      dockerfile: Dockerfile.web
    restart: unless-stopped
    depends_on:
      - orux
      - api
    ports:
      - "80:80"
      - "443:443"
    environment:
      # Dominio real -> TLS automático. Sin dominio queda "localhost" (cert
      # local, el navegador avisa: ok para probar, no para producción real).
      - ORUX_SITE_ADDRESS=${ORUX_SITE_ADDRESS:-localhost}
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy-data:/data       # certificados
      - caddy-config:/config

volumes:
  orux-data:
  orux-pg:
  caddy-data:
  caddy-config:
