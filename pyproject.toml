[project]
name = "laidea"
version = "0.0.1"
description = "Editor colaborativo en tiempo real sobre Git"
requires-python = ">=3.11"
dependencies = [
    "websockets>=13.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0",
    "pytest-asyncio>=0.23",
]

[project.scripts]
laidea-server = "laidea.server.__main__:main"

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
include = ["laidea*"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]
