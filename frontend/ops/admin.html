<!doctype html>
<html lang="es" id="html-root">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="color-scheme" content="dark">
<meta name="theme-color" content="#050608">
<title>Orux · operador</title>

<!-- Favicon: reusa el de la landing (raíz del dominio en deploy). En dev
     suelto puede 404 silencioso; el panel ops solo se ve en /admin del
     deploy real, así que no vale la pena duplicar el asset acá. -->
<link rel="icon" type="image/svg+xml" href="/favicon.svg">

<!--
  Tipografía REAL — Inter + JetBrains Mono — igual que IDE y landing.
  Antes el panel ops corría con `system-ui`, lo que lo delataba como
  "componente foráneo" frente al producto. Preconnect para no bloquear,
  display=swap; si falla la red, el stack de sistema en los tokens toma
  el relevo sin romper nada.
-->
<!--
  AUDITORIA-SEGURIDAD 2026-05-25 A-INF-02: Google Fonts removido para no
  filtrar la IP del operador a Google. El admin es vanilla (sin build) y
  visita por un solo humano (tú), así que en vez de auto-hostear las
  fuentes con un servidor estático, dejamos que el stack de sistema tome
  el relevo (var --font-ui ya lleva los fallbacks system-ui/Segoe UI/etc.).
  El panel del operador no es donde se libra la batalla tipográfica.
-->

<!-- Pinta el fondo profundo antes de que cargue el CSS: cero flash. -->
<style>html,body{background:#050608}</style>

<!--
  Capa 23 (+ auth por cuenta): panel de OPERADOR (vos), NO el cliente del
  IDE. Vanilla, una página, sin build, separada de todo. Entrás con TU
  cuenta ya registrada (usuario+contraseña, el mismo login del IDE); el
  server (ORUX_ADMIN_USER) verifica que sos el operador y emite un token
  de SESIÓN firmado. Ese token (no un secreto compartido) vive solo en
  sessionStorage. Esto es la consola de cobro manual: alguien paga → premium.

  Sistema de diseño: heredado del IDE (Islands Dark). Mismos tokens, mismas
  superficies, mismo verde acento — el panel ops debe sentirse del mismo
  producto, no un componente foráneo. La hexafoil marca lleva el gradient
  plateado/acero igual que landing y login: una sola identidad visual.
-->
<style>
/* ─── TOKENS — heredados de "Islands Dark" del IDE ────────────────────── */
:root {
  color-scheme: dark;

  /* Superficies: rampa de 6 escalones por luminancia */
  --bg-deep:     #050608;
  --bg:          #0a0b0e;
  --surface:     #101217;
  --surface-2:   #15181e;
  --surface-3:   #1b1f26;
  --elevated:    #232830;

  /* Bordes */
  --border:       #272b34;
  --border-soft:  #181b21;
  --border-strong:#333a47;
  --hl:           rgba(255,255,255,0.035);

  /* Texto: 4 niveles, AA sobre --surface. --faint subido en sincronía con
     el IDE para asegurar contraste AA en labels y eyebrows de 10px. */
  --text:    #e8eaef;
  --text-2:  #b5bac5;
  --muted:   #8a8f9c;
  --faint:   #6b7180;

  /* Acento de marca: verde→cian. Mismo gradiente que el IDE. */
  --accent:      #4cc38a;
  --accent-2:    #34d9bf;
  --accent-weak: rgba(76,195,138,0.10);
  --accent-soft: rgba(76,195,138,0.16);
  --accent-line: rgba(76,195,138,0.55);
  --grad:        linear-gradient(135deg, var(--accent), var(--accent-2));
  --accent-ink:  #04130c;

  /* Estados */
  --ok:    #4cc98a;   --ok-bg:    rgba(76,201,138,0.13);
  --warn:  #d8a93e;   --warn-bg:  rgba(216,169,62,0.13);
  --bad:   #e8636f;   --bad-bg:   rgba(232,99,111,0.13);
  --info:  #62a8f0;   --info-bg:  rgba(98,168,240,0.13);

  /* Radii */
  --r-sm: 5px; --r: 7px; --r-md: 8px; --r-lg: 10px; --r-isla: 12px;

  /* Spacing (escala 4px) */
  --s-1: 4px; --s-2: 8px; --s-3: 12px; --s-4: 16px;
  --s-5: 20px; --s-6: 24px; --s-8: 32px;

  /* Tipografía: misma escala densa del IDE */
  --t-xs: 10.5px; --t-sm: 11.5px; --t-base: 13px; --t-md: 13.5px;
  --t-lg: 15px; --t-xl: 19px;

  /* Sombras: real + hairline = objeto táctil. Sin neón. */
  --shadow-sm:    0 1px 2px rgba(0,0,0,0.34);
  --shadow:       0 1px 2px rgba(0,0,0,0.3), 0 6px 20px -14px rgba(0,0,0,0.5);
  --shadow-modal: 0 24px 64px -16px rgba(0,0,0,0.66), 0 2px 8px rgba(0,0,0,0.45);

  /* Motion */
  --tr: 120ms cubic-bezier(.4,0,.2,1);

  --font-ui: "Inter", -apple-system, BlinkMacSystemFont, "Segoe UI",
    Roboto, system-ui, sans-serif;
  --font-mono: "JetBrains Mono", ui-monospace, SFMono-Regular, Menlo,
    Consolas, monospace;
}

/* ─── RESET MÍNIMO ──────────────────────────────────────────────────────── */
*, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

/* ─── BASE ──────────────────────────────────────────────────────────────── */
body {
  font: var(--t-base)/1.55 var(--font-ui);
  background: var(--bg-deep);
  color: var(--text);
  min-height: 100vh;
  display: flex;
  flex-direction: column;
  align-items: center;
  -webkit-font-smoothing: antialiased;
  -moz-osx-font-smoothing: grayscale;
  text-rendering: optimizeLegibility;
  font-optical-sizing: auto;
  font-feature-settings: "cv11" 1, "ss03" 1;
}
/* Vignette estática y neutra — coherente con el IDE (mismo gesto). */
body::before {
  content: ""; position: fixed; inset: 0; z-index: -1; pointer-events: none;
  background: radial-gradient(130vw 80vh at 50% -25%,
    rgba(255,255,255,0.014), transparent 62%);
}
::selection { background: rgba(76,195,138,0.24); }
:focus-visible {
  outline: none; border-radius: var(--r-sm);
  box-shadow: 0 0 0 2px var(--bg-deep), 0 0 0 3.5px var(--accent-soft);
}

/* Scrollbars finas, coherentes con IDE */
*::-webkit-scrollbar { width: 10px; height: 10px; }
*::-webkit-scrollbar-thumb {
  background: var(--border-strong); border-radius: 999px;
  border: 3px solid transparent; background-clip: padding-box;
  transition: background var(--tr);
}
*::-webkit-scrollbar-thumb:hover { background: #424857; background-clip: padding-box; }
*::-webkit-scrollbar-corner, *::-webkit-scrollbar-track { background: transparent; }
* { scrollbar-width: thin; scrollbar-color: var(--border-strong) transparent; }

/* ─── TIPOGRAFÍA ────────────────────────────────────────────────────────── */
h1, h2, h3 { font-weight: 650; letter-spacing: -0.015em; }
code, .mono {
  font-family: var(--font-mono);
  font-size: 0.92em;
  font-variant-numeric: tabular-nums;
}

/* ─── LOGOMARK · hexafoil con gradient plateado/acero ────────────────────
   El SVG del logo ahora es el oficial (mismo que landing/login/IDE), suelto
   en su flexbox sin "placa verde". El gradiente plateado se inyecta por
   <linearGradient> dentro del propio SVG — id único por instancia (gate vs
   panel) para evitar colisiones. */
.lm { display: block; flex: none; }

/* ─── GATE (pantalla de login) ──────────────────────────────────────────── */
#gate {
  display: flex; align-items: center; justify-content: center;
  flex: 1; width: 100%; padding: var(--s-8) var(--s-4);
  animation: fadeIn 220ms cubic-bezier(.22,1,.36,1) both;
}

.gate-card {
  width: 100%; max-width: 408px;
  background:
    linear-gradient(180deg, var(--hl), transparent 2px),
    var(--surface);
  border: 1px solid var(--border-soft);
  border-radius: var(--r-isla);
  box-shadow: var(--shadow), 0 0 0 1px var(--border-soft) inset;
  overflow: hidden;
}

.gate-header {
  padding: var(--s-6) var(--s-6) var(--s-5);
  border-bottom: 1px solid var(--border-soft);
}

.gate-logo {
  display: flex; align-items: center; gap: 11px;
  margin-bottom: var(--s-4);
}

.gate-logo-text {
  display: flex; flex-direction: column; line-height: 1.18;
}

.gate-logo-text strong {
  font-size: var(--t-lg); font-weight: 700;
  color: var(--text); letter-spacing: -0.02em;
}

.gate-logo-text span {
  font-family: var(--font-mono);
  font-size: 10px; color: var(--faint);
  letter-spacing: 0.14em; text-transform: uppercase;
}

.gate-header h2 {
  font-size: var(--t-lg); color: var(--text);
  margin-bottom: 4px; letter-spacing: -0.015em;
}

.gate-header p {
  font-size: var(--t-sm); color: var(--muted); line-height: 1.55;
}

.gate-body { padding: var(--s-5) var(--s-6) var(--s-6); }

.field {
  display: flex; flex-direction: column; gap: var(--s-1);
  margin-bottom: var(--s-4);
}

.field label {
  font-size: var(--t-xs); font-weight: 600;
  color: var(--text-2); letter-spacing: 0.06em;
  text-transform: uppercase;
}

/* ─── INPUTS / BUTTONS ──────────────────────────────────────────────────── */
input[type="password"],
input[type="text"] {
  font: inherit; font-size: var(--t-base);
  width: 100%; padding: 0.6rem 0.75rem;
  background: var(--bg); color: var(--text);
  border: 1px solid var(--border); border-radius: var(--r);
  outline: none;
  transition: border-color var(--tr), box-shadow var(--tr), background var(--tr);
}
input[type="password"]:hover, input[type="text"]:hover { border-color: var(--border-strong); }
input[type="password"]:focus, input[type="text"]:focus {
  border-color: var(--accent);
  box-shadow: 0 0 0 3px var(--accent-weak);
  background: var(--surface);
}
input::placeholder { color: var(--faint); }

.btn {
  display: inline-flex; align-items: center; justify-content: center;
  gap: var(--s-2); font-family: inherit; font-weight: 600;
  cursor: pointer; border: 1px solid transparent;
  border-radius: var(--r); white-space: nowrap;
  letter-spacing: -0.005em; line-height: 1;
  transition: background var(--tr), color var(--tr),
    border-color var(--tr), box-shadow var(--tr),
    transform var(--tr), filter var(--tr);
}
.btn:active { transform: translateY(1px); }
/* Estado deshabilitado (botón en carga): plano, sin hover ni active.
   Opacidad 0.5 unifica con el IDE — un solo "peso visual" de disabled
   en todo el producto. */
.btn:disabled {
  opacity: 0.5; cursor: default;
  transform: none !important; filter: none !important;
}

/* Botón primario — gradiente acento del IDE */
.btn-primary {
  width: 100%; padding: 0.65rem 0.95rem; font-size: var(--t-base);
  background: var(--grad); color: var(--accent-ink); font-weight: 700;
  box-shadow:
    0 1px 0 rgba(255,255,255,0.16) inset,
    0 4px 14px -8px rgba(52,217,191,0.5);
}
.btn-primary:hover { filter: brightness(1.05); transform: translateY(-1px); }
.btn-primary:active { transform: translateY(1px); filter: brightness(.98); }

/* Botón secundario */
.btn-secondary {
  padding: 0.42rem 0.7rem; font-size: var(--t-sm);
  background: var(--surface-2); color: var(--text);
  border-color: var(--border);
}
.btn-secondary:hover {
  background: var(--surface-3); border-color: var(--border-strong);
  transform: translateY(-1px);
}

/* Botón de acción de plan — tamaño reducido */
.btn-plan {
  padding: 5px 11px; font-size: var(--t-xs); font-weight: 700;
  background: var(--surface-2); color: var(--accent);
  border: 1px solid var(--accent-soft); border-radius: var(--r-sm);
  cursor: pointer; font-family: inherit; letter-spacing: -0.005em;
  transition: background var(--tr), color var(--tr),
    border-color var(--tr), transform var(--tr);
}
.btn-plan:hover {
  background: var(--accent-weak); border-color: var(--accent-line);
  transform: translateY(-1px);
}

.btn-plan.btn-plan-downgrade {
  color: var(--muted); border-color: var(--border);
}
.btn-plan.btn-plan-downgrade:hover {
  background: var(--surface-3); color: var(--text);
  border-color: var(--border-strong);
}

/* Botón borrar — mismo tamaño que btn-plan pero con tono "bad" suave.
   No grita rojo en reposo (no queremos que el operador apriete por error);
   se intensifica al hover para confirmar que es destructivo. */
.btn-borrar {
  padding: 5px 11px; font-size: var(--t-xs); font-weight: 700;
  background: var(--surface-2); color: var(--muted);
  border: 1px solid var(--border); border-radius: var(--r-sm);
  cursor: pointer; font-family: inherit; letter-spacing: -0.005em;
  transition: background var(--tr), color var(--tr),
    border-color var(--tr), transform var(--tr);
}
.btn-borrar:hover {
  background: var(--bad-bg); color: var(--bad);
  border-color: rgba(232,99,111,0.4);
  transform: translateY(-1px);
}

/* Acción dentro del chip de usuario: aparece SOLO en hover del chip
   (no contaminar la lista con × por todos lados). */
.user-chip-x {
  display: inline-flex; align-items: center; justify-content: center;
  width: 14px; height: 14px;
  margin-left: 2px; border-radius: 50%;
  background: transparent; color: var(--faint);
  border: 0; cursor: pointer; padding: 0;
  font: 700 11px/1 var(--font-mono);
  opacity: 0; pointer-events: none;
  transition: opacity var(--tr), background var(--tr), color var(--tr);
}
.user-chip:hover .user-chip-x { opacity: 1; pointer-events: auto; }
.user-chip-x:hover { background: var(--bad-bg); color: var(--bad); }

/* Acciones en columna acción de la tabla: dos botones lado a lado */
.col-action { width: 200px; }
.col-action-row { display: inline-flex; gap: 6px; }

/* ─── MENSAJES DE FEEDBACK ──────────────────────────────────────────────── */
.msg {
  min-height: 20px; font-size: var(--t-sm); border-radius: var(--r-sm);
  transition: all var(--tr);
}
.msg:empty { display: none; }
.msg.ok {
  color: var(--ok); background: var(--ok-bg);
  border: 1px solid rgba(76,201,138,0.25);
  padding: 0.45rem 0.7rem;
}
.msg.err {
  color: var(--bad); background: var(--bad-bg);
  border: 1px solid rgba(232,99,111,0.25);
  padding: 0.45rem 0.7rem;
}
#gmsg { margin-top: var(--s-3); font-size: var(--t-sm); }

/* ─── PANEL PRINCIPAL ───────────────────────────────────────────────────── */
#panel {
  width: 100%; max-width: 1000px;
  padding: 0 var(--s-4) 64px;
  animation: fadeIn 220ms cubic-bezier(.22,1,.36,1) both;
}

/* Header del panel — padding rebajado: en una consola de operador el
   header no es un "hero", es chrome. Antes consumía ~44px de altura
   antes de mostrar el primer dato; ahora ~32px. Recuperás casi una fila
   de tabla en el viewport sin sacrificar legibilidad de la marca. */
.panel-header {
  display: flex; align-items: center; justify-content: space-between;
  padding: var(--s-5) 0 var(--s-4);
  border-bottom: 1px solid var(--border-soft);
  margin-bottom: var(--s-5);
}

.panel-brand { display: flex; align-items: center; gap: 11px; }

.panel-brand-text strong {
  font-size: var(--t-md); font-weight: 700;
  color: var(--text); letter-spacing: -0.02em;
}
.panel-brand-text span {
  font-family: var(--font-mono);
  font-size: 10px; color: var(--faint);
  letter-spacing: 0.14em; text-transform: uppercase;
  display: block; line-height: 1.2;
}

.panel-actions {
  display: flex; align-items: center; gap: var(--s-3);
}

/* Aviso de sesión */
.session-badge {
  font-family: var(--font-mono);
  font-size: 10.5px; color: var(--faint);
  letter-spacing: 0.04em;
}

#msg { margin-bottom: var(--s-4); }

/* ─── SECCIONES ───────────────────────────────────────────────────────────
   Margin entre secciones rebajado de 32px a 24px: el operador escanea
   muchos equipos/usuarios; un abismo entre "Teams" y "Users" desperdicia
   real estate sin agregar claridad. La cabecera de cada sección sigue
   anclando la separación visual. */
.section { margin-bottom: var(--s-6); }

.section-header {
  display: flex; align-items: center; justify-content: space-between;
  margin-bottom: var(--s-3);
}

.section-title {
  font-size: 10px; font-weight: 700; color: var(--faint);
  letter-spacing: 0.13em; text-transform: uppercase;
}

/* Contador de equipos/usuarios — antes era una pill tímida en 10.5px /
   --muted; el operador necesita escanear ese número de un vistazo
   (cuántos equipos hay, cuántos usuarios). Subimos a t-sm y --text-2:
   sigue siendo metadata pero con la legibilidad que el rol pide. */
.section-count {
  font-family: var(--font-mono);
  font-size: var(--t-sm); color: var(--text-2);
  background: var(--surface-2);
  border: 1px solid var(--border-soft);
  border-radius: 999px; padding: 2px 10px;
  letter-spacing: 0;
}

/* ─── TABLA DE EQUIPOS ──────────────────────────────────────────────────
   Borde subido a --border (de --border-soft): la tabla es el objeto
   principal de la página, tiene que destacar del fondo. Antes el
   hairline se diluía sobre --bg y la tabla se leía "flotando sin
   marco" — el efecto es premium-sutil-equivocado en una consola. */
.table-wrap {
  background:
    linear-gradient(180deg, var(--hl), transparent 2px),
    var(--surface);
  border: 1px solid var(--border);
  border-radius: var(--r-md);
  overflow: hidden;
  box-shadow: var(--shadow-sm);
}

table#teams {
  border-collapse: collapse; width: 100%;
  font-variant-numeric: tabular-nums;
}

table#teams thead tr {
  background: var(--bg);
  border-bottom: 1px solid var(--border-soft);
}

table#teams th {
  text-align: left; padding: 10px 16px;
  font-size: 10px; font-weight: 700;
  color: var(--faint);
  letter-spacing: 0.13em; text-transform: uppercase;
  white-space: nowrap;
}

table#teams tbody tr {
  border-bottom: 1px solid var(--border-soft);
  transition: background var(--tr);
}
table#teams tbody tr:last-child { border-bottom: none; }
table#teams tbody tr:hover { background: var(--surface-2); }

/* Filas de tabla — 14px de padding vertical (antes 12px). La diferencia
   es mínima pero los párpados la registran al escanear varias filas en
   sucesión: cada fila respira un escalón más sin perder densidad de
   herramienta. */
table#teams td {
  padding: 14px 16px;
  font-size: var(--t-base);
  vertical-align: middle;
}

/* Nombre del equipo — más prominente */
.team-name {
  font-weight: 600; color: var(--text);
  letter-spacing: -0.005em;
}

/* ID del equipo — mono (es un identificador), pero sin "pozo": el
   bloque con fondo+borde de antes lo hacía competir con team-name como
   si fueran del mismo peso. Ahora es metadata pura: mismo lenguaje que
   un commit hash en el log de git. */
.team-id {
  font-family: var(--font-mono);
  font-size: var(--t-xs); color: var(--faint);
  letter-spacing: 0.01em;
}

/* Badges de plan */
.badge {
  display: inline-flex; align-items: center; gap: 5px;
  font-size: 10px; font-weight: 700;
  letter-spacing: 0.06em; text-transform: uppercase;
  border-radius: 999px; padding: 3px 10px;
  white-space: nowrap;
}
.badge-premium {
  background: var(--accent-weak); color: var(--accent);
  border: 1px solid var(--accent-soft);
}
.badge-premium::before { content: "★"; font-size: 9px; }
.badge-free {
  background: var(--surface-2); color: var(--muted);
  border: 1px solid var(--border-soft);
}

/* Columna de miembros */
.members-count { color: var(--text-2); }

/* Columna acción */
.col-action { width: 120px; }

/* ─── SECCIÓN USUARIOS ──────────────────────────────────────────────────── */
.users-wrap {
  background:
    linear-gradient(180deg, var(--hl), transparent 2px),
    var(--surface);
  border: 1px solid var(--border-soft);
  border-radius: var(--r-md);
  padding: var(--s-4) var(--s-5);
  box-shadow: var(--shadow-sm);
}

.users-chips { display: flex; flex-wrap: wrap; gap: var(--s-2); }

.user-chip {
  display: inline-flex; align-items: center; gap: 6px;
  background: var(--surface-2);
  border: 1px solid var(--border-soft);
  border-radius: 999px; padding: 4px 12px;
  font-size: var(--t-xs); color: var(--text-2);
  font-family: var(--font-mono);
  transition: border-color var(--tr), background var(--tr);
}
.user-chip:hover { border-color: var(--border); background: var(--surface-3); }
.user-chip::before {
  content: ""; width: 6px; height: 6px; border-radius: 50%;
  background: var(--accent); flex-shrink: 0;
}

/* ─── EMPTY STATES ──────────────────────────────────────────────────────── */
.empty-state {
  text-align: center;
  padding: var(--s-8) var(--s-6);
  color: var(--muted);
}
.empty-state .empty-icon {
  font-size: 28px; margin-bottom: 10px; opacity: 0.45;
  color: var(--faint);
}
.empty-state p { font-size: var(--t-sm); }

/* ─── ANIMACIONES ───────────────────────────────────────────────────────── */
@keyframes fadeIn {
  from { opacity: 0; transform: translateY(5px); }
  to   { opacity: 1; transform: none; }
}

@media (prefers-reduced-motion: reduce) {
  *, *::before, *::after { animation: none !important; transition: none !important; }
}

/* ─── RESPONSIVE ────────────────────────────────────────────────────────── */
@media (max-width: 600px) {
  .panel-header { flex-direction: column; align-items: flex-start; gap: var(--s-3); }
  .panel-actions { flex-wrap: wrap; }
  table#teams th:nth-child(2),
  table#teams td:nth-child(2) { display: none; }
  .gate-header, .gate-body { padding-left: var(--s-5); padding-right: var(--s-5); }
}

/* ─── SELECTOR DE IDIOMA ─────────────────────────────────────────────────── */
.lang-pill {
  display: inline-flex; align-items: center; gap: 1px;
  background: var(--surface-2);
  border: 1px solid var(--border-soft);
  border-radius: 999px; padding: 2px 4px;
}
.lang-pill button {
  font: 700 10px/1 var(--font-mono);
  text-transform: uppercase; letter-spacing: 0.06em;
  color: var(--faint); padding: 3px 7px;
  border-radius: 999px; cursor: pointer; border: 0;
  background: transparent;
  transition: background var(--tr), color var(--tr);
}
.lang-pill button:hover { color: var(--text-2); }
.lang-pill button.lp-active {
  background: var(--accent-weak); color: var(--accent);
  box-shadow: inset 0 0 0 1px var(--accent-soft);
}
</style>
</head>
<body>

<!-- ───────────────────────────────────────────────────────────────────────
     GATE: pantalla de autenticación del operador
─────────────────────────────────────────────────────────────────────────── -->
<div id="gate">
  <div class="gate-card">
    <div class="gate-header">
      <div class="gate-logo">
        <!-- Logomark de marca — hexafoil con gradient plateado/acero. Mismo
             SVG conceptual que IDE y landing usan (Logomark.tsx). El id del
             linearGradient es único por instancia para que dos logos en la
             misma página no colisionen. -->
        <svg class="lm" width="26" height="26" viewBox="0 0 48 48" fill="none" aria-hidden="true">
          <defs>
            <linearGradient id="lm-silver-gate" x1="0%" y1="0%" x2="100%" y2="100%">
              <stop offset="0%" stop-color="#FFFFFF"/>
              <stop offset="45%" stop-color="#C8C8CC"/>
              <stop offset="100%" stop-color="#6E6E72"/>
            </linearGradient>
          </defs>
          <g transform="translate(24,24)" fill="none" stroke="url(#lm-silver-gate)"
             stroke-width="2.2" stroke-linejoin="round">
            <path d="M0 -16 Q8.7 -5.8 0 0 Q-8.7 -5.8 0 -16 Z"/>
            <g transform="rotate(60)"><path d="M0 -16 Q8.7 -5.8 0 0 Q-8.7 -5.8 0 -16 Z"/></g>
            <g transform="rotate(120)"><path d="M0 -16 Q8.7 -5.8 0 0 Q-8.7 -5.8 0 -16 Z"/></g>
            <g transform="rotate(180)"><path d="M0 -16 Q8.7 -5.8 0 0 Q-8.7 -5.8 0 -16 Z"/></g>
            <g transform="rotate(240)"><path d="M0 -16 Q8.7 -5.8 0 0 Q-8.7 -5.8 0 -16 Z"/></g>
            <g transform="rotate(300)"><path d="M0 -16 Q8.7 -5.8 0 0 Q-8.7 -5.8 0 -16 Z"/></g>
            <circle cx="0" cy="0" r="1.9" fill="url(#lm-silver-gate)" stroke="none"/>
          </g>
        </svg>
        <div class="gate-logo-text">
          <strong>Orux</strong>
          <span id="t-console"></span>
        </div>
      </div>
      <h2 id="t-restricted"></h2>
      <p id="t-gate-desc"></p>
    </div>
    <div class="gate-body">
      <div class="field">
        <label for="usr" id="t-user-label"></label>
        <input id="usr" type="text"
               autocomplete="username" spellcheck="false"
               onkeydown="if(event.key==='Enter')entrar()">
      </div>
      <div class="field">
        <label for="pwd" id="t-pass-label"></label>
        <input id="pwd" type="password"
               autocomplete="current-password"
               onkeydown="if(event.key==='Enter')entrar()">
      </div>
      <button class="btn btn-primary" onclick="entrar()" id="t-enter-btn"></button>
      <div id="gmsg" class="msg" role="status" aria-live="polite"></div>
      <!-- selector de idioma dentro del gate -->
      <div style="margin-top:14px">
        <span class="lang-pill">
          <button id="ll-es" onclick="cambiarLang('es')">ES</button>
          <button id="ll-en" onclick="cambiarLang('en')">EN</button>
        </span>
      </div>
    </div>
  </div>
</div>

<!-- ───────────────────────────────────────────────────────────────────────
     PANEL PRINCIPAL: visible solo tras autenticación exitosa
─────────────────────────────────────────────────────────────────────────── -->
<div id="panel" style="display:none">

  <div class="panel-header">
    <div class="panel-brand">
      <svg class="lm" width="22" height="22" viewBox="0 0 48 48" fill="none" aria-hidden="true">
        <defs>
          <linearGradient id="lm-silver-panel" x1="0%" y1="0%" x2="100%" y2="100%">
            <stop offset="0%" stop-color="#FFFFFF"/>
            <stop offset="45%" stop-color="#C8C8CC"/>
            <stop offset="100%" stop-color="#6E6E72"/>
          </linearGradient>
        </defs>
        <g transform="translate(24,24)" fill="none" stroke="url(#lm-silver-panel)"
           stroke-width="2.2" stroke-linejoin="round">
          <path d="M0 -16 Q8.7 -5.8 0 0 Q-8.7 -5.8 0 -16 Z"/>
          <g transform="rotate(60)"><path d="M0 -16 Q8.7 -5.8 0 0 Q-8.7 -5.8 0 -16 Z"/></g>
          <g transform="rotate(120)"><path d="M0 -16 Q8.7 -5.8 0 0 Q-8.7 -5.8 0 -16 Z"/></g>
          <g transform="rotate(180)"><path d="M0 -16 Q8.7 -5.8 0 0 Q-8.7 -5.8 0 -16 Z"/></g>
          <g transform="rotate(240)"><path d="M0 -16 Q8.7 -5.8 0 0 Q-8.7 -5.8 0 -16 Z"/></g>
          <g transform="rotate(300)"><path d="M0 -16 Q8.7 -5.8 0 0 Q-8.7 -5.8 0 -16 Z"/></g>
          <circle cx="0" cy="0" r="1.9" fill="url(#lm-silver-panel)" stroke="none"/>
        </g>
      </svg>
      <div class="panel-brand-text">
        <strong>Orux</strong>
        <span id="t-console2"></span>
      </div>
    </div>
    <div class="panel-actions">
      <span class="session-badge" id="t-session-badge"></span>
      <span class="lang-pill" style="margin-right:4px">
        <button id="pl-es" onclick="cambiarLang('es')">ES</button>
        <button id="pl-en" onclick="cambiarLang('en')">EN</button>
      </span>
      <button class="btn btn-secondary" onclick="cargar()" id="t-reload-btn"></button>
      <button class="btn btn-secondary" onclick="salir()" id="t-logout-btn"></button>
    </div>
  </div>

  <div class="msg" id="msg" role="status" aria-live="polite"></div>

  <div class="section">
    <div class="section-header">
      <span class="section-title" id="t-teams-title"></span>
      <span class="section-count" id="teams-count"></span>
    </div>
    <div class="table-wrap">
      <table id="teams">
        <thead>
          <tr>
            <th id="t-th-name"></th>
            <th>ID</th>
            <th id="t-th-plan"></th>
            <th id="t-th-members"></th>
            <th class="col-action" id="t-th-action"></th>
          </tr>
        </thead>
        <tbody></tbody>
      </table>
    </div>
  </div>

  <div class="section">
    <div class="section-header">
      <span class="section-title" id="t-users-title"></span>
      <span class="section-count" id="users-count"></span>
    </div>
    <div class="users-wrap">
      <div id="users"></div>
    </div>
  </div>

</div>

<!-- ───────────────────────────────────────────────────────────────────────
     SCRIPT: auth ahora por cuenta (POST /api/v1/login -> token de sesión).
     El resto del contrato se preserva: api()/setPlan()/cargar(), Bearer,
     sessionStorage("orux_op"), endpoints /teams /users /teams/:id/plan.
─────────────────────────────────────────────────────────────────────────── -->
<script>
/* ── i18n ─────────────────────────────────────────────────────────────── */
const LANG_KEY = "orux_lang";
const I18N = {
  es: {
    console: "Consola de operador",
    restricted: "Acceso restringido",
    gate_desc: "Ingresa con tu cuenta de operador (el mismo usuario y contraseña con los que inicias sesión). La sesión vive solo en esta pestaña.",
    user_label: "Usuario",
    user_placeholder: "tu usuario",
    pass_label: "Contraseña",
    pass_placeholder: "tu contraseña",
    enter_btn: "Entrar",
    enter_btn_busy: "Entrando…",
    session_badge: "sesión activa (solo esta pestaña)",
    reload: "↺ Recargar",
    logout: "Salir",
    teams_title: "Equipos",
    users_title: "Usuarios registrados",
    th_name: "Nombre",
    th_plan: "Plan",
    th_members: "Miembros",
    th_action: "Acción",
    no_teams: "No hay equipos registrados aún.",
    no_users: "No hay usuarios registrados.",
    teams_count: (n) => n + " equipos",
    users_count: (n) => n + " usuarios",
    plan_changed: (id, plan) => "equipo " + id + " → " + plan,
    delete_team_btn: "Borrar",
    delete_team_confirm: (nombre, id) =>
      "¿Borrar el equipo \"" + nombre + "\" (id " + id + ")?\n\n" +
      "Esto elimina sus miembros, invitaciones, ownership y propuestas. " +
      "El workspace en disco NO se borra desde acá. La suscripción de " +
      "Stripe (si era premium) sigue activa — cancélala desde el dashboard.",
    team_deleted: (id) => "equipo " + id + " borrado",
    delete_user_title: "Borrar usuario",
    delete_user_confirm: (u) =>
      "¿Borrar al usuario \"" + u + "\"?\n\n" +
      "Si es creador de algún equipo o dueño de archivos, te lo va a " +
      "rechazar (borra esos equipos primero).",
    user_deleted: (u) => "usuario " + u + " borrado",
    err_unauth: "no autorizado: ",
    err_generic: "error: ",
    err_load: "error al cargar datos: ",
  },
  en: {
    console: "Operator console",
    restricted: "Restricted access",
    gate_desc: "Sign in with your operator account (same username and password you use to log in). The session lives only in this tab.",
    user_label: "Username",
    user_placeholder: "your username",
    pass_label: "Password",
    pass_placeholder: "your password",
    enter_btn: "Sign in",
    enter_btn_busy: "Signing in…",
    session_badge: "active session (this tab only)",
    reload: "↺ Reload",
    logout: "Sign out",
    teams_title: "Teams",
    users_title: "Registered users",
    th_name: "Name",
    th_plan: "Plan",
    th_members: "Members",
    th_action: "Action",
    no_teams: "No teams registered yet.",
    no_users: "No registered users.",
    teams_count: (n) => n + " teams",
    users_count: (n) => n + " users",
    plan_changed: (id, plan) => "team " + id + " → " + plan,
    delete_team_btn: "Delete",
    delete_team_confirm: (nombre, id) =>
      "Delete team \"" + nombre + "\" (id " + id + ")?\n\n" +
      "This removes its members, invites, ownership and proposals. The " +
      "workspace on disk is NOT deleted from here. The Stripe subscription " +
      "(if premium) stays active — cancel it from the dashboard.",
    team_deleted: (id) => "team " + id + " deleted",
    delete_user_title: "Delete user",
    delete_user_confirm: (u) =>
      "Delete user \"" + u + "\"?\n\n" +
      "If they own a team or files, it will refuse (delete those teams first).",
    user_deleted: (u) => "user " + u + " deleted",
    err_unauth: "unauthorized: ",
    err_generic: "error: ",
    err_load: "error loading data: ",
  },
};

let _lang = (localStorage.getItem(LANG_KEY)) || "es";
if (_lang !== "es" && _lang !== "en") _lang = "es";
let tx = I18N[_lang];

function _$(id) { return document.getElementById(id); }
function _txt(id, txt) { const el = _$(id); if (el) el.textContent = txt; }
function _ph(id, ph) { const el = _$(id); if (el) el.placeholder = ph; }

function aplicarLang() {
  tx = I18N[_lang];
  document.documentElement.lang = _lang;
  _txt("t-console", tx.console);
  _txt("t-console2", tx.console);
  _txt("t-restricted", tx.restricted);
  _txt("t-gate-desc", tx.gate_desc);
  _txt("t-user-label", tx.user_label);
  _ph("usr", tx.user_placeholder);
  _txt("t-pass-label", tx.pass_label);
  _ph("pwd", tx.pass_placeholder);
  _txt("t-enter-btn", tx.enter_btn);
  _txt("t-session-badge", tx.session_badge);
  _txt("t-reload-btn", tx.reload);
  _txt("t-logout-btn", tx.logout);
  _txt("t-teams-title", tx.teams_title);
  _txt("t-users-title", tx.users_title);
  _txt("t-th-name", tx.th_name);
  _txt("t-th-plan", tx.th_plan);
  _txt("t-th-members", tx.th_members);
  _txt("t-th-action", tx.th_action);
  // Resaltar botón activo en ambas pills
  ["ll-es","pl-es"].forEach(id => {
    const el = _$(id); if (el) el.classList.toggle("lp-active", _lang === "es");
  });
  ["ll-en","pl-en"].forEach(id => {
    const el = _$(id); if (el) el.classList.toggle("lp-active", _lang === "en");
  });
}

function cambiarLang(l) {
  _lang = l;
  localStorage.setItem(LANG_KEY, l);
  aplicarLang();
  // Re-renderizar si el panel está visible (para actualizar los textos dinámicos)
  if (_$("panel").style.display !== "none") cargar();
}

/* ── API ──────────────────────────────────────────────────────────────── */
const API = "/api/v1";
function tok() { return sessionStorage.getItem("orux_op") || ""; }
function H() { return { "Authorization": "Bearer " + tok() }; }

async function api(path, opts) {
  const r = await fetch(API + path, {
    ...opts, headers: { ...H(), ...(opts && opts.headers || {}) },
  });
  if (!r.ok) throw new Error((await r.json().catch(() => ({}))).error
                             || ("HTTP " + r.status));
  return r.json();
}

function _abrirPanel() {
  _$("gate").style.display = "none";
  _$("panel").style.display = "";
  cargar();
}

async function entrar() {
  const username = _$("usr").value.trim();
  const password = _$("pwd").value;
  const gm = _$("gmsg");
  const btn = _$("t-enter-btn");
  // Estado de carga: deshabilita el botón mientras el login viaja. Evita
  // el doble-submit (dos POST /login) y da feedback en red lenta — el
  // mismo gesto que el login del IDE, que ya lo tenía.
  if (btn) { btn.disabled = true; btn.textContent = tx.enter_btn_busy; }
  try {
    const r = await fetch(API + "/login", {
      method: "POST",
      headers: { "Content-Type": "application/json" },
      body: JSON.stringify({ username, password }),
    });
    if (!r.ok) {
      throw new Error((await r.json().catch(() => ({}))).error || ("HTTP " + r.status));
    }
    const { token } = await r.json();
    sessionStorage.setItem("orux_op", token);
    _$("pwd").value = "";
    _abrirPanel();
  } catch (e) {
    gm.className = "msg err";
    gm.textContent = tx.err_unauth + e.message;
  } finally {
    // En éxito, _abrirPanel() ya ocultó el gate; restaurar el botón es
    // inofensivo y deja el gate listo por si se vuelve a él (salir()).
    if (btn) { btn.disabled = false; btn.textContent = tx.enter_btn; }
  }
}

async function salir() {
  // AUDITORIA-SEGURIDAD 2026-05-25 A-HTTP-05: pedir al server que revoque
  // todas las sesiones del operador (incluye este token y cualquier otro
  // emitido a la misma cuenta — útil si alguien dejó el panel abierto en
  // otra máquina). Best-effort: si la llamada falla, igual limpiamos
  // client-side; el peor caso es la situación previa (token sigue válido
  // hasta su exp natural).
  const t = sessionStorage.getItem("orux_op") || "";
  if (t) {
    try {
      await fetch("/api/v1/logout", {
        method: "POST",
        headers: { Authorization: "Bearer " + t },
      });
    } catch (_e) {
      // sin internet / 5xx: igual cerramos client-side.
    }
  }
  sessionStorage.removeItem("orux_op");
  _$("panel").style.display = "none";
  _$("msg").textContent = "";
  _$("gmsg").textContent = "";
  const pwd = _$("pwd");
  if (pwd) pwd.value = "";
  _$("gate").style.display = "";
}

async function _reanudar() {
  try {
    await api("/teams");
    _abrirPanel();
  } catch (_e) {
    sessionStorage.removeItem("orux_op");
  }
}

function flash(msg, ok) {
  const m = _$("msg");
  m.className = "msg " + (ok ? "ok" : "err");
  m.textContent = msg;
}

async function setPlan(id, plan) {
  try {
    await api("/teams/" + encodeURIComponent(id) + "/plan", {
      method: "POST", headers: { "Content-Type": "application/json" },
      body: JSON.stringify({ plan }),
    });
    flash(tx.plan_changed(id, plan), true);
    cargar();
  } catch (e) { flash(tx.err_generic + e.message, false); }
}

// Capa 23: borrar team/user desde el panel. `confirm()` nativo del browser:
// suficiente para una consola de un solo operador; no vale el peso de un
// modal propio (ese tipo de fricción es exactamente lo que hace al panel
// pesado de mantener). El backend valida que no se pueda borrar al operador
// ni a un user que sea creador-de-team / dueño-de-archivos — los mensajes
// de error vienen ya traducidos del server.
async function borrarTeam(id, nombre) {
  if (!confirm(tx.delete_team_confirm(nombre, id))) return;
  try {
    await api("/teams/" + encodeURIComponent(id), { method: "DELETE" });
    flash(tx.team_deleted(id), true);
    cargar();
  } catch (e) { flash(tx.err_generic + e.message, false); }
}

async function borrarUser(u) {
  if (!confirm(tx.delete_user_confirm(u))) return;
  try {
    await api("/users/" + encodeURIComponent(u), { method: "DELETE" });
    flash(tx.user_deleted(u), true);
    cargar();
  } catch (e) { flash(tx.err_generic + e.message, false); }
}

async function cargar() {
  try {
    const teams = await api("/teams");

    const tb = document.querySelector("#teams tbody");
    tb.innerHTML = "";

    const countEl = _$("teams-count");
    if (countEl) countEl.textContent = tx.teams_count(teams.length);

    if (teams.length === 0) {
      const tr = document.createElement("tr");
      tr.innerHTML = `<td colspan="5">
        <div class="empty-state">
          <div class="empty-icon">◎</div>
          <p>${tx.no_teams}</p>
        </div>
      </td>`;
      tb.appendChild(tr);
    } else {
      for (const team of teams) {
        const otro = team.plan === "premium" ? "free" : "premium";
        const esPremium = team.plan === "premium";
        const tr = document.createElement("tr");

        // textContent (no innerHTML) en todo lo que viene del backend:
        // team.nombre ya filtra <> en `validar_nombre_equipo`, pero defensa
        // en profundidad — si mañana se relaja el validador, esto sigue sano.
        const tdNombre = document.createElement("td");
        const spanNombre = document.createElement("span");
        spanNombre.className = "team-name";
        spanNombre.textContent = team.nombre;
        tdNombre.appendChild(spanNombre);

        const tdId = document.createElement("td");
        const spanId = document.createElement("span");
        spanId.className = "team-id";
        spanId.textContent = team.id;
        tdId.appendChild(spanId);

        const tdPlan = document.createElement("td");
        const spanPlan = document.createElement("span");
        spanPlan.className = esPremium ? "badge badge-premium" : "badge badge-free";
        spanPlan.textContent = esPremium ? "Premium" : "Free";
        tdPlan.appendChild(spanPlan);

        const tdMiembros = document.createElement("td");
        const spanMiembros = document.createElement("span");
        spanMiembros.className = "members-count";
        spanMiembros.textContent = team.miembros;
        tdMiembros.appendChild(spanMiembros);

        const tdAccion = document.createElement("td");
        const wrap = document.createElement("span");
        wrap.className = "col-action-row";
        const b = document.createElement("button");
        b.className = esPremium ? "btn-plan btn-plan-downgrade" : "btn-plan";
        b.textContent = esPremium ? "→ Free" : "→ Premium";
        b.onclick = () => setPlan(team.id, otro);
        wrap.appendChild(b);
        const bDel = document.createElement("button");
        bDel.className = "btn-borrar";
        bDel.textContent = tx.delete_team_btn;
        bDel.onclick = () => borrarTeam(team.id, team.nombre);
        wrap.appendChild(bDel);
        tdAccion.appendChild(wrap);

        tr.appendChild(tdNombre);
        tr.appendChild(tdId);
        tr.appendChild(tdPlan);
        tr.appendChild(tdMiembros);
        tr.appendChild(tdAccion);
        tb.appendChild(tr);
      }
    }

    const us = await api("/users");

    const usersCountEl = _$("users-count");
    if (usersCountEl) usersCountEl.textContent = tx.users_count(us.length);

    const usersDiv = _$("users");
    if (us.length === 0) {
      usersDiv.innerHTML = `<div class="empty-state" style="padding:24px 0">
        <p>${tx.no_users}</p>
      </div>`;
    } else {
      // username ya está limitado a `a-z0-9._-` o `gh:<github-login>` en
      // backend — XSS imposible por charset. textContent igual, por consistencia
      // con la regla "nada del backend va por innerHTML" del resto de la consola.
      usersDiv.innerHTML = "";
      const wrap = document.createElement("div");
      wrap.className = "users-chips";
      for (const u of us) {
        const chip = document.createElement("span");
        chip.className = "user-chip";
        // Texto del username + botón × que aparece en hover. Separados para
        // que el textContent del chip no se "contamine" con el ×.
        const lbl = document.createElement("span");
        lbl.textContent = u;
        chip.appendChild(lbl);
        const x = document.createElement("button");
        x.className = "user-chip-x";
        x.type = "button";
        x.textContent = "×";
        x.setAttribute("aria-label", tx.delete_user_title + ": " + u);
        x.onclick = () => borrarUser(u);
        chip.appendChild(x);
        wrap.appendChild(chip);
      }
      usersDiv.appendChild(wrap);
    }

  } catch (e) { flash(tx.err_load + e.message, false); }
}

/* Inicialización: aplicar idioma y auto-login */
aplicarLang();
if (tok()) _reanudar();
</script>
</body>
</html>
