<!doctype html>
<html lang="es" id="html-root">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Orux · operador</title>

<!-- Favicon: reusa el de la landing (raíz del dominio en deploy). En dev
     suelto puede 404 silencioso; el panel ops solo se ve en /admin del
     deploy real, así que no vale la pena duplicar el asset acá. -->
<link rel="icon" type="image/svg+xml" href="/favicon.svg">
<!--
  Capa 23 (+ auth por cuenta): panel de OPERADOR (vos), NO el cliente del
  IDE. Vanilla, una página, sin build, separada de todo. Entrás con TU
  cuenta ya registrada (usuario+contraseña, el mismo login del IDE); el
  server (ORUX_ADMIN_USER) verifica que sos el operador y emite un token
  de SESIÓN firmado. Ese token (no un secreto compartido) vive solo en
  sessionStorage. Esto es la consola de cobro manual: alguien paga → premium.

  Diseño coherente con la identidad visual del producto (negros fríos,
  acento verde esmeralda, tipografía system-ui). Sin dependencias externas.
-->
<style>
/* ─── TOKENS DE DISEÑO ──────────────────────────────────────────────────── */
:root {
  color-scheme: dark;

  /* Fondos */
  --bg-base:      #060709;
  --bg-surface:   #0b0d11;
  --bg-elevated:  #121419;
  --bg-panel:     #181b22;

  /* Bordes */
  --border:       #2a2e38;
  --border-sub:   #1d2027;

  /* Texto */
  --text-hi:      #edeef2;
  --text-lo:      #8b909e;
  --text-muted:   #565b68;

  /* Acento esmeralda (gradiente 120 deg) */
  --accent-a:     #4cc38a;
  --accent-b:     #2fe6c6;
  --accent-grad:  linear-gradient(120deg, #4cc38a, #2fe6c6);
  --accent-weak:  rgba(76, 195, 138, .12);

  /* Estados */
  --ok:           #56d98a;
  --err:          #f0707a;
  --ok-bg:        rgba(86, 217, 138, .1);
  --err-bg:       rgba(240, 112, 122, .1);

  /* Radii */
  --r-sm:  6px;
  --r-md:  10px;
  --r-lg:  14px;

  /* Motion */
  --t: 140ms ease;
}

/* ─── RESET MÍNIMO ──────────────────────────────────────────────────────── */
*, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

/* ─── BASE ──────────────────────────────────────────────────────────────── */
body {
  font: 14px/1.6 system-ui, -apple-system, sans-serif;
  background: var(--bg-base);
  color: var(--text-hi);
  min-height: 100vh;
  display: flex;
  flex-direction: column;
  align-items: center;
}

/* ─── TIPOGRAFÍA ────────────────────────────────────────────────────────── */
h1, h2, h3 { font-weight: 600; letter-spacing: -.01em; }
code, .mono {
  font-family: ui-monospace, "Cascadia Code", "Fira Code", monospace;
  font-size: .85em;
}

/* ─── GATE (pantalla de login) ──────────────────────────────────────────── */
#gate {
  display: flex;
  align-items: center;
  justify-content: center;
  flex: 1;
  width: 100%;
  padding: 40px 16px;
  animation: fadeIn 200ms ease both;
}

.gate-card {
  width: 100%;
  max-width: 400px;
  background: var(--bg-elevated);
  border: 1px solid var(--border);
  border-radius: var(--r-lg);
  /* patrón "isla": hairline superior de acento + sombra de elevación */
  box-shadow:
    0 0 0 1px var(--border-sub) inset,
    0 1px 0 0 rgba(76, 195, 138, .18) inset,
    0 8px 32px rgba(0,0,0,.45);
  overflow: hidden;
}

.gate-header {
  padding: 28px 28px 20px;
  border-bottom: 1px solid var(--border-sub);
}

.gate-logo {
  display: flex;
  align-items: center;
  gap: 10px;
  margin-bottom: 16px;
}

.gate-logo-mark {
  width: 32px;
  height: 32px;
  background: var(--accent-grad);
  border-radius: var(--r-sm);
  display: grid;
  place-items: center;
  font-weight: 800;
  font-size: 15px;
  color: #060709;
  flex-shrink: 0;
}

.gate-logo-text {
  display: flex;
  flex-direction: column;
  line-height: 1.2;
}

.gate-logo-text strong {
  font-size: 15px;
  font-weight: 700;
  background: var(--accent-grad);
  -webkit-background-clip: text;
  -webkit-text-fill-color: transparent;
  background-clip: text;
}

.gate-logo-text span {
  font-size: 11px;
  color: var(--text-muted);
  letter-spacing: .04em;
  text-transform: uppercase;
}

.gate-header h2 {
  font-size: 18px;
  color: var(--text-hi);
  margin-bottom: 4px;
}

.gate-header p {
  font-size: 13px;
  color: var(--text-lo);
}

.gate-body {
  padding: 24px 28px 28px;
}

.field {
  display: flex;
  flex-direction: column;
  gap: 6px;
  margin-bottom: 16px;
}

.field label {
  font-size: 12px;
  font-weight: 500;
  color: var(--text-lo);
  letter-spacing: .03em;
  text-transform: uppercase;
}

/* ─── INPUTS / BUTTONS ──────────────────────────────────────────────────── */
input[type="password"],
input[type="text"] {
  font: inherit;
  width: 100%;
  padding: 10px 12px;
  background: var(--bg-panel);
  color: var(--text-hi);
  border: 1px solid var(--border);
  border-radius: var(--r-sm);
  outline: none;
  transition: border-color var(--t), box-shadow var(--t);
}

input[type="password"]:focus,
input[type="text"]:focus {
  border-color: var(--accent-a);
  box-shadow: 0 0 0 3px var(--accent-weak);
}

input::placeholder { color: var(--text-muted); }

.btn {
  display: inline-flex;
  align-items: center;
  justify-content: center;
  gap: 6px;
  font: inherit;
  font-weight: 500;
  cursor: pointer;
  border: none;
  border-radius: var(--r-sm);
  transition: opacity var(--t), box-shadow var(--t), background var(--t);
  white-space: nowrap;
}

.btn:active { opacity: .8; }

/* Botón primario — gradiente acento */
.btn-primary {
  width: 100%;
  padding: 10px 16px;
  background: var(--accent-grad);
  color: #060709;
  font-size: 14px;
}

.btn-primary:hover { box-shadow: 0 0 0 3px var(--accent-weak); }

/* Botón secundario — borde sutil */
.btn-secondary {
  padding: 6px 12px;
  background: var(--bg-panel);
  color: var(--text-hi);
  border: 1px solid var(--border);
  font-size: 13px;
}

.btn-secondary:hover {
  background: var(--bg-elevated);
  border-color: var(--border);
}

/* Botón de acción de plan — tamaño reducido */
.btn-plan {
  padding: 5px 10px;
  font-size: 12px;
  font-weight: 600;
  background: var(--bg-panel);
  color: var(--accent-a);
  border: 1px solid rgba(76, 195, 138, .3);
  border-radius: var(--r-sm);
  cursor: pointer;
  transition: background var(--t), box-shadow var(--t);
  font-family: inherit;
}

.btn-plan:hover {
  background: var(--accent-weak);
  box-shadow: 0 0 0 2px rgba(76, 195, 138, .25);
}

.btn-plan.btn-plan-downgrade {
  color: var(--text-lo);
  border-color: var(--border);
}

.btn-plan.btn-plan-downgrade:hover {
  background: var(--bg-elevated);
  color: var(--text-hi);
}

/* ─── MENSAJES DE FEEDBACK ──────────────────────────────────────────────── */
.msg {
  min-height: 20px;
  font-size: 13px;
  border-radius: var(--r-sm);
  transition: all var(--t);
}

.msg:empty { display: none; }

.msg.ok {
  color: var(--ok);
  background: var(--ok-bg);
  border: 1px solid rgba(86, 217, 138, .2);
  padding: 8px 12px;
}

.msg.err {
  color: var(--err);
  background: var(--err-bg);
  border: 1px solid rgba(240, 112, 122, .2);
  padding: 8px 12px;
}

/* Mensaje dentro del gate-body */
#gmsg {
  margin-top: 12px;
  font-size: 13px;
}

/* ─── PANEL PRINCIPAL ───────────────────────────────────────────────────── */
#panel {
  width: 100%;
  max-width: 980px;
  padding: 0 16px 64px;
  animation: fadeIn 200ms ease both;
}

/* Header del panel */
.panel-header {
  display: flex;
  align-items: center;
  justify-content: space-between;
  padding: 24px 0 20px;
  border-bottom: 1px solid var(--border-sub);
  margin-bottom: 28px;
}

.panel-brand {
  display: flex;
  align-items: center;
  gap: 10px;
}

.panel-logo-mark {
  width: 28px;
  height: 28px;
  background: var(--accent-grad);
  border-radius: var(--r-sm);
  display: grid;
  place-items: center;
  font-weight: 800;
  font-size: 13px;
  color: #060709;
}

.panel-brand-text strong {
  font-size: 15px;
  font-weight: 700;
  background: var(--accent-grad);
  -webkit-background-clip: text;
  -webkit-text-fill-color: transparent;
  background-clip: text;
}

.panel-brand-text span {
  font-size: 11px;
  color: var(--text-muted);
  letter-spacing: .04em;
  text-transform: uppercase;
  display: block;
  line-height: 1.2;
}

.panel-actions {
  display: flex;
  align-items: center;
  gap: 12px;
}

/* Aviso de sesión */
.session-badge {
  font-size: 11px;
  color: var(--text-muted);
  letter-spacing: .03em;
}

/* Mensaje global del panel */
#msg {
  margin-bottom: 16px;
}

/* ─── SECCIONES ─────────────────────────────────────────────────────────── */
.section {
  margin-bottom: 36px;
}

.section-header {
  display: flex;
  align-items: center;
  justify-content: space-between;
  margin-bottom: 14px;
}

.section-title {
  font-size: 13px;
  font-weight: 600;
  color: var(--text-lo);
  letter-spacing: .05em;
  text-transform: uppercase;
}

.section-count {
  font-size: 12px;
  color: var(--text-muted);
  background: var(--bg-panel);
  border: 1px solid var(--border-sub);
  border-radius: 100px;
  padding: 2px 8px;
}

/* ─── TABLA DE EQUIPOS ──────────────────────────────────────────────────── */
.table-wrap {
  background: var(--bg-elevated);
  border: 1px solid var(--border);
  border-radius: var(--r-md);
  overflow: hidden;
  box-shadow: 0 1px 0 0 rgba(76, 195, 138, .08) inset;
}

table#teams {
  border-collapse: collapse;
  width: 100%;
}

table#teams thead tr {
  background: var(--bg-panel);
  border-bottom: 1px solid var(--border);
}

table#teams th {
  text-align: left;
  padding: 10px 16px;
  font-size: 11px;
  font-weight: 600;
  color: var(--text-muted);
  letter-spacing: .06em;
  text-transform: uppercase;
  white-space: nowrap;
}

table#teams tbody tr {
  border-bottom: 1px solid var(--border-sub);
  transition: background var(--t);
}

table#teams tbody tr:last-child { border-bottom: none; }

table#teams tbody tr:nth-child(even) {
  background: rgba(255, 255, 255, .015);
}

table#teams tbody tr:hover {
  background: var(--accent-weak);
}

table#teams td {
  padding: 12px 16px;
  font-size: 13px;
  vertical-align: middle;
}

/* Nombre del equipo — más prominente */
.team-name {
  font-weight: 600;
  color: var(--text-hi);
}

/* ID en mono */
.team-id {
  font-family: ui-monospace, monospace;
  font-size: 12px;
  color: var(--text-muted);
  background: var(--bg-panel);
  border: 1px solid var(--border-sub);
  border-radius: 4px;
  padding: 2px 6px;
  display: inline-block;
}

/* Badges de plan */
.badge {
  display: inline-flex;
  align-items: center;
  gap: 5px;
  font-size: 11px;
  font-weight: 700;
  letter-spacing: .04em;
  text-transform: uppercase;
  border-radius: 100px;
  padding: 3px 10px;
  white-space: nowrap;
}

.badge-premium {
  background: var(--accent-weak);
  color: var(--accent-a);
  border: 1px solid rgba(76, 195, 138, .3);
}

.badge-premium::before {
  content: "★";
  font-size: 9px;
}

.badge-free {
  background: rgba(139, 144, 158, .1);
  color: var(--text-muted);
  border: 1px solid var(--border-sub);
}

/* Columna de miembros */
.members-count {
  color: var(--text-lo);
  font-variant-numeric: tabular-nums;
}

/* Columna acción */
.col-action { width: 120px; }

/* ─── SECCIÓN USUARIOS ──────────────────────────────────────────────────── */
.users-wrap {
  background: var(--bg-elevated);
  border: 1px solid var(--border);
  border-radius: var(--r-md);
  padding: 16px 20px;
  box-shadow: 0 1px 0 0 rgba(76, 195, 138, .08) inset;
}

.users-chips {
  display: flex;
  flex-wrap: wrap;
  gap: 8px;
}

.user-chip {
  display: inline-flex;
  align-items: center;
  gap: 6px;
  background: var(--bg-panel);
  border: 1px solid var(--border-sub);
  border-radius: 100px;
  padding: 4px 12px;
  font-size: 12px;
  color: var(--text-lo);
  font-family: ui-monospace, monospace;
  transition: border-color var(--t);
}

.user-chip:hover { border-color: var(--border); }

.user-chip::before {
  content: "";
  width: 6px;
  height: 6px;
  border-radius: 50%;
  background: var(--accent-a);
  flex-shrink: 0;
}

/* ─── EMPTY STATES ──────────────────────────────────────────────────────── */
.empty-state {
  text-align: center;
  padding: 48px 24px;
  color: var(--text-muted);
}

.empty-state .empty-icon {
  font-size: 32px;
  margin-bottom: 12px;
  opacity: .4;
}

.empty-state p {
  font-size: 13px;
}

/* ─── ANIMACIONES ───────────────────────────────────────────────────────── */
@keyframes fadeIn {
  from { opacity: 0; transform: translateY(6px); }
  to   { opacity: 1; transform: translateY(0); }
}

@media (prefers-reduced-motion: reduce) {
  *, *::before, *::after { animation: none !important; transition: none !important; }
}

/* ─── RESPONSIVE ────────────────────────────────────────────────────────── */
@media (max-width: 600px) {
  .panel-header { flex-direction: column; align-items: flex-start; gap: 12px; }
  table#teams th:nth-child(2),
  table#teams td:nth-child(2) { display: none; }
  .gate-header, .gate-body { padding-left: 20px; padding-right: 20px; }
}

/* ─── SELECTOR DE IDIOMA ─────────────────────────────────────────────────── */
.lang-pill {
  display: inline-flex; align-items: center; gap: 1px;
  background: var(--bg-panel); border: 1px solid var(--border-sub);
  border-radius: 100px; padding: 2px 4px;
}
.lang-pill button {
  font: 700 10px/1 ui-monospace, monospace; text-transform: uppercase;
  letter-spacing: .06em; color: var(--text-muted);
  padding: 3px 6px; border-radius: 100px; cursor: pointer;
  background: transparent; transition: background var(--t), color var(--t);
  font-family: inherit;
}
.lang-pill button:hover { color: var(--text-lo); }
.lang-pill button.lp-active { background: var(--accent-weak); color: var(--accent-a); }
</style>
</head>
<body>

<!-- ───────────────────────────────────────────────────────────────────────
     GATE: pantalla de autenticación del operador
─────────────────────────────────────────────────────────────────────────── -->
<div id="gate">
  <div class="gate-card">
    <div class="gate-header">
      <div class="gate-logo">
        <div class="gate-logo-mark" aria-hidden="true">
          <!-- Hexafoil: marca de Orux. Stroke en el negro de fondo del
               tema para que contraste sobre el chip esmeralda; sin
               gradient acero acá porque la placa ya es verde brillante
               y un gradient plateado encima se perdería. -->
          <svg viewBox="0 0 48 48" width="20" height="20" fill="none">
            <g transform="translate(24,24)" stroke="#060709"
               stroke-width="2.2" stroke-linejoin="round">
              <path d="M0 -16 Q8.7 -5.8 0 0 Q-8.7 -5.8 0 -16 Z"/>
              <g transform="rotate(60)"><path d="M0 -16 Q8.7 -5.8 0 0 Q-8.7 -5.8 0 -16 Z"/></g>
              <g transform="rotate(120)"><path d="M0 -16 Q8.7 -5.8 0 0 Q-8.7 -5.8 0 -16 Z"/></g>
              <g transform="rotate(180)"><path d="M0 -16 Q8.7 -5.8 0 0 Q-8.7 -5.8 0 -16 Z"/></g>
              <g transform="rotate(240)"><path d="M0 -16 Q8.7 -5.8 0 0 Q-8.7 -5.8 0 -16 Z"/></g>
              <g transform="rotate(300)"><path d="M0 -16 Q8.7 -5.8 0 0 Q-8.7 -5.8 0 -16 Z"/></g>
              <circle cx="0" cy="0" r="1.9" fill="#060709" stroke="none"/>
            </g>
          </svg>
        </div>
        <div class="gate-logo-text">
          <strong>Orux</strong>
          <span id="t-console"></span>
        </div>
      </div>
      <h2 id="t-restricted"></h2>
      <p id="t-gate-desc"></p>
    </div>
    <div class="gate-body">
      <div class="field">
        <label for="usr" id="t-user-label"></label>
        <input id="usr" type="text"
               autocomplete="username" spellcheck="false"
               onkeydown="if(event.key==='Enter')entrar()">
      </div>
      <div class="field">
        <label for="pwd" id="t-pass-label"></label>
        <input id="pwd" type="password"
               autocomplete="current-password"
               onkeydown="if(event.key==='Enter')entrar()">
      </div>
      <button class="btn btn-primary" onclick="entrar()" id="t-enter-btn"></button>
      <div id="gmsg" class="msg"></div>
      <!-- selector de idioma dentro del gate -->
      <div style="margin-top:14px">
        <span class="lang-pill">
          <button id="ll-es" onclick="cambiarLang('es')">ES</button>
          <button id="ll-en" onclick="cambiarLang('en')">EN</button>
        </span>
      </div>
    </div>
  </div>
</div>

<!-- ───────────────────────────────────────────────────────────────────────
     PANEL PRINCIPAL: visible solo tras autenticación exitosa
─────────────────────────────────────────────────────────────────────────── -->
<div id="panel" style="display:none">

  <div class="panel-header">
    <div class="panel-brand">
      <div class="panel-logo-mark" aria-hidden="true">
        <svg viewBox="0 0 48 48" width="18" height="18" fill="none">
          <g transform="translate(24,24)" stroke="#060709"
             stroke-width="2.4" stroke-linejoin="round">
            <path d="M0 -16 Q8.7 -5.8 0 0 Q-8.7 -5.8 0 -16 Z"/>
            <g transform="rotate(60)"><path d="M0 -16 Q8.7 -5.8 0 0 Q-8.7 -5.8 0 -16 Z"/></g>
            <g transform="rotate(120)"><path d="M0 -16 Q8.7 -5.8 0 0 Q-8.7 -5.8 0 -16 Z"/></g>
            <g transform="rotate(180)"><path d="M0 -16 Q8.7 -5.8 0 0 Q-8.7 -5.8 0 -16 Z"/></g>
            <g transform="rotate(240)"><path d="M0 -16 Q8.7 -5.8 0 0 Q-8.7 -5.8 0 -16 Z"/></g>
            <g transform="rotate(300)"><path d="M0 -16 Q8.7 -5.8 0 0 Q-8.7 -5.8 0 -16 Z"/></g>
            <circle cx="0" cy="0" r="1.9" fill="#060709" stroke="none"/>
          </g>
        </svg>
      </div>
      <div class="panel-brand-text">
        <strong>Orux</strong>
        <span id="t-console2"></span>
      </div>
    </div>
    <div class="panel-actions">
      <span class="session-badge" id="t-session-badge"></span>
      <span class="lang-pill" style="margin-right:4px">
        <button id="pl-es" onclick="cambiarLang('es')">ES</button>
        <button id="pl-en" onclick="cambiarLang('en')">EN</button>
      </span>
      <button class="btn btn-secondary" onclick="cargar()" id="t-reload-btn"></button>
      <button class="btn btn-secondary" onclick="salir()" id="t-logout-btn"></button>
    </div>
  </div>

  <div class="msg" id="msg"></div>

  <div class="section">
    <div class="section-header">
      <span class="section-title" id="t-teams-title"></span>
      <span class="section-count" id="teams-count"></span>
    </div>
    <div class="table-wrap">
      <table id="teams">
        <thead>
          <tr>
            <th id="t-th-name"></th>
            <th>ID</th>
            <th id="t-th-plan"></th>
            <th id="t-th-members"></th>
            <th class="col-action" id="t-th-action"></th>
          </tr>
        </thead>
        <tbody></tbody>
      </table>
    </div>
  </div>

  <div class="section">
    <div class="section-header">
      <span class="section-title" id="t-users-title"></span>
      <span class="section-count" id="users-count"></span>
    </div>
    <div class="users-wrap">
      <div id="users"></div>
    </div>
  </div>

</div>

<!-- ───────────────────────────────────────────────────────────────────────
     SCRIPT: auth ahora por cuenta (POST /api/v1/login -> token de sesión).
     El resto del contrato se preserva: api()/setPlan()/cargar(), Bearer,
     sessionStorage("orux_op"), endpoints /teams /users /teams/:id/plan.
─────────────────────────────────────────────────────────────────────────── -->
<script>
/* ── i18n ─────────────────────────────────────────────────────────────── */
const LANG_KEY = "orux_lang";
const I18N = {
  es: {
    console: "Consola de operador",
    restricted: "Acceso restringido",
    gate_desc: "Ingresa con tu cuenta de operador (el mismo usuario y contraseña con los que inicias sesión). La sesión vive solo en esta pestaña.",
    user_label: "Usuario",
    user_placeholder: "tu usuario",
    pass_label: "Contraseña",
    pass_placeholder: "tu contraseña",
    enter_btn: "Entrar",
    session_badge: "sesión activa (solo esta pestaña)",
    reload: "↺ Recargar",
    logout: "Salir",
    teams_title: "Equipos",
    users_title: "Usuarios registrados",
    th_name: "Nombre",
    th_plan: "Plan",
    th_members: "Miembros",
    th_action: "Acción",
    no_teams: "No hay equipos registrados aún.",
    no_users: "No hay usuarios registrados.",
    teams_count: (n) => n + " equipos",
    users_count: (n) => n + " usuarios",
    plan_changed: (id, plan) => "equipo " + id + " → " + plan,
    err_unauth: "no autorizado: ",
    err_generic: "error: ",
    err_load: "error al cargar datos: ",
  },
  en: {
    console: "Operator console",
    restricted: "Restricted access",
    gate_desc: "Sign in with your operator account (same username and password you use to log in). The session lives only in this tab.",
    user_label: "Username",
    user_placeholder: "your username",
    pass_label: "Password",
    pass_placeholder: "your password",
    enter_btn: "Sign in",
    session_badge: "active session (this tab only)",
    reload: "↺ Reload",
    logout: "Sign out",
    teams_title: "Teams",
    users_title: "Registered users",
    th_name: "Name",
    th_plan: "Plan",
    th_members: "Members",
    th_action: "Action",
    no_teams: "No teams registered yet.",
    no_users: "No registered users.",
    teams_count: (n) => n + " teams",
    users_count: (n) => n + " users",
    plan_changed: (id, plan) => "team " + id + " → " + plan,
    err_unauth: "unauthorized: ",
    err_generic: "error: ",
    err_load: "error loading data: ",
  },
};

let _lang = (localStorage.getItem(LANG_KEY)) || "es";
if (_lang !== "es" && _lang !== "en") _lang = "es";
let tx = I18N[_lang];

function _$(id) { return document.getElementById(id); }
function _txt(id, txt) { const el = _$(id); if (el) el.textContent = txt; }
function _ph(id, ph) { const el = _$(id); if (el) el.placeholder = ph; }

function aplicarLang() {
  tx = I18N[_lang];
  document.documentElement.lang = _lang;
  _txt("t-console", tx.console);
  _txt("t-console2", tx.console);
  _txt("t-restricted", tx.restricted);
  _txt("t-gate-desc", tx.gate_desc);
  _txt("t-user-label", tx.user_label);
  _ph("usr", tx.user_placeholder);
  _txt("t-pass-label", tx.pass_label);
  _ph("pwd", tx.pass_placeholder);
  _txt("t-enter-btn", tx.enter_btn);
  _txt("t-session-badge", tx.session_badge);
  _txt("t-reload-btn", tx.reload);
  _txt("t-logout-btn", tx.logout);
  _txt("t-teams-title", tx.teams_title);
  _txt("t-users-title", tx.users_title);
  _txt("t-th-name", tx.th_name);
  _txt("t-th-plan", tx.th_plan);
  _txt("t-th-members", tx.th_members);
  _txt("t-th-action", tx.th_action);
  // Resaltar botón activo en ambas pills
  ["ll-es","pl-es"].forEach(id => {
    const el = _$(id); if (el) el.classList.toggle("lp-active", _lang === "es");
  });
  ["ll-en","pl-en"].forEach(id => {
    const el = _$(id); if (el) el.classList.toggle("lp-active", _lang === "en");
  });
}

function cambiarLang(l) {
  _lang = l;
  localStorage.setItem(LANG_KEY, l);
  aplicarLang();
  // Re-renderizar si el panel está visible (para actualizar los textos dinámicos)
  if (_$("panel").style.display !== "none") cargar();
}

/* ── API ──────────────────────────────────────────────────────────────── */
const API = "/api/v1";
function tok() { return sessionStorage.getItem("orux_op") || ""; }
function H() { return { "Authorization": "Bearer " + tok() }; }

async function api(path, opts) {
  const r = await fetch(API + path, {
    ...opts, headers: { ...H(), ...(opts && opts.headers || {}) },
  });
  if (!r.ok) throw new Error((await r.json().catch(() => ({}))).error
                             || ("HTTP " + r.status));
  return r.json();
}

function _abrirPanel() {
  _$("gate").style.display = "none";
  _$("panel").style.display = "";
  cargar();
}

async function entrar() {
  const username = _$("usr").value.trim();
  const password = _$("pwd").value;
  const gm = _$("gmsg");
  try {
    const r = await fetch(API + "/login", {
      method: "POST",
      headers: { "Content-Type": "application/json" },
      body: JSON.stringify({ username, password }),
    });
    if (!r.ok) {
      throw new Error((await r.json().catch(() => ({}))).error || ("HTTP " + r.status));
    }
    const { token } = await r.json();
    sessionStorage.setItem("orux_op", token);
    _$("pwd").value = "";
    _abrirPanel();
  } catch (e) {
    gm.className = "msg err";
    gm.textContent = tx.err_unauth + e.message;
  }
}

function salir() {
  sessionStorage.removeItem("orux_op");
  _$("panel").style.display = "none";
  _$("msg").textContent = "";
  _$("gmsg").textContent = "";
  const pwd = _$("pwd");
  if (pwd) pwd.value = "";
  _$("gate").style.display = "";
}

async function _reanudar() {
  try {
    await api("/teams");
    _abrirPanel();
  } catch (_e) {
    sessionStorage.removeItem("orux_op");
  }
}

function flash(msg, ok) {
  const m = _$("msg");
  m.className = "msg " + (ok ? "ok" : "err");
  m.textContent = msg;
}

async function setPlan(id, plan) {
  try {
    await api("/teams/" + encodeURIComponent(id) + "/plan", {
      method: "POST", headers: { "Content-Type": "application/json" },
      body: JSON.stringify({ plan }),
    });
    flash(tx.plan_changed(id, plan), true);
    cargar();
  } catch (e) { flash(tx.err_generic + e.message, false); }
}

async function cargar() {
  try {
    const teams = await api("/teams");

    const tb = document.querySelector("#teams tbody");
    tb.innerHTML = "";

    const countEl = _$("teams-count");
    if (countEl) countEl.textContent = tx.teams_count(teams.length);

    if (teams.length === 0) {
      const tr = document.createElement("tr");
      tr.innerHTML = `<td colspan="5">
        <div class="empty-state">
          <div class="empty-icon">◎</div>
          <p>${tx.no_teams}</p>
        </div>
      </td>`;
      tb.appendChild(tr);
    } else {
      for (const team of teams) {
        const otro = team.plan === "premium" ? "free" : "premium";
        const esPremium = team.plan === "premium";
        const tr = document.createElement("tr");

        const tdNombre = document.createElement("td");
        tdNombre.innerHTML = `<span class="team-name">${team.nombre}</span>`;

        const tdId = document.createElement("td");
        tdId.innerHTML = `<span class="team-id">${team.id}</span>`;

        const tdPlan = document.createElement("td");
        tdPlan.innerHTML = esPremium
          ? `<span class="badge badge-premium">Premium</span>`
          : `<span class="badge badge-free">Free</span>`;

        const tdMiembros = document.createElement("td");
        tdMiembros.innerHTML = `<span class="members-count">${team.miembros}</span>`;

        const tdAccion = document.createElement("td");
        const b = document.createElement("button");
        b.className = esPremium ? "btn-plan btn-plan-downgrade" : "btn-plan";
        b.textContent = esPremium ? "→ Free" : "→ Premium";
        b.onclick = () => setPlan(team.id, otro);
        tdAccion.appendChild(b);

        tr.appendChild(tdNombre);
        tr.appendChild(tdId);
        tr.appendChild(tdPlan);
        tr.appendChild(tdMiembros);
        tr.appendChild(tdAccion);
        tb.appendChild(tr);
      }
    }

    const us = await api("/users");

    const usersCountEl = _$("users-count");
    if (usersCountEl) usersCountEl.textContent = tx.users_count(us.length);

    const usersDiv = _$("users");
    if (us.length === 0) {
      usersDiv.innerHTML = `<div class="empty-state" style="padding:24px 0">
        <p>${tx.no_users}</p>
      </div>`;
    } else {
      const chips = us.map(u => `<span class="user-chip">${u}</span>`).join("");
      usersDiv.innerHTML = `<div class="users-chips">${chips}</div>`;
    }

  } catch (e) { flash(tx.err_load + e.message, false); }
}

/* Inicialización: aplicar idioma y auto-login */
aplicarLang();
if (tok()) _reanudar();
</script>
</body>
</html>
