<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>laidea · operador</title>
<!--
  Capa 23: panel de OPERADOR (vos), NO el cliente del IDE. Vanilla, una
  página, sin build, separada de todo. Habla la API interna /api/v1 con un
  token de operador (Bearer). El token vive solo en sessionStorage (no se
  persiste). Esto es la consola de cobro manual: alguien paga -> premium.
-->
<style>
  :root { color-scheme: dark; }
  body { font: 14px/1.5 system-ui, sans-serif; background:#0e0f12;
         color:#e6e6e6; margin:0; padding:24px; }
  h1 { font-size:16px; margin:0 0 16px; }
  input, button, select { font:inherit; padding:6px 8px; border-radius:6px;
         border:1px solid #333; background:#17181c; color:#e6e6e6; }
  button { cursor:pointer; }
  table { border-collapse:collapse; width:100%; margin-top:12px; }
  th,td { text-align:left; padding:8px 10px; border-bottom:1px solid #222; }
  .free { color:#9aa0ad; } .premium { color:#4cc38a; font-weight:600; }
  .msg { margin:10px 0; min-height:18px; }
  .err { color:#e5534b; } .ok { color:#4cc38a; }
  .gate { max-width:360px; }
</style>
</head>
<body>
<h1>laidea · consola de operador</h1>

<div id="gate" class="gate">
  <p>Token de operador (no se guarda en disco):</p>
  <input id="tok" type="password" placeholder="LAIDEA_ADMIN_TOKEN"
         style="width:100%">
  <p><button onclick="entrar()">entrar</button></p>
  <div id="gmsg" class="msg"></div>
</div>

<div id="panel" style="display:none">
  <div class="msg" id="msg"></div>
  <button onclick="cargar()">recargar</button>
  <h2 style="font-size:14px">Equipos</h2>
  <table id="teams"><thead><tr>
    <th>nombre</th><th>id</th><th>plan</th><th>miembros</th><th>acción</th>
  </tr></thead><tbody></tbody></table>
  <h2 style="font-size:14px">Usuarios</h2>
  <div id="users"></div>
</div>

<script>
const API = "/api/v1";
function tok() { return sessionStorage.getItem("laidea_op") || ""; }
function H() { return { "Authorization": "Bearer " + tok() }; }

async function api(path, opts) {
  const r = await fetch(API + path, {
    ...opts, headers: { ...H(), ...(opts && opts.headers || {}) },
  });
  if (!r.ok) throw new Error((await r.json().catch(() => ({}))).error
                             || ("HTTP " + r.status));
  return r.json();
}

async function entrar() {
  const t = document.getElementById("tok").value.trim();
  sessionStorage.setItem("laidea_op", t);
  try {
    await api("/teams");                       // valida el token
    document.getElementById("gate").style.display = "none";
    document.getElementById("panel").style.display = "";
    cargar();
  } catch (e) {
    document.getElementById("gmsg").className = "msg err";
    document.getElementById("gmsg").textContent = "no autorizado: " + e.message;
  }
}

function flash(t, ok) {
  const m = document.getElementById("msg");
  m.className = "msg " + (ok ? "ok" : "err");
  m.textContent = t;
}

async function setPlan(id, plan) {
  try {
    await api("/teams/" + encodeURIComponent(id) + "/plan", {
      method: "POST", headers: { "Content-Type": "application/json" },
      body: JSON.stringify({ plan }),
    });
    flash("equipo " + id + " -> " + plan, true);
    cargar();
  } catch (e) { flash("error: " + e.message, false); }
}

async function cargar() {
  try {
    const teams = await api("/teams");
    const tb = document.querySelector("#teams tbody");
    tb.innerHTML = "";
    for (const t of teams) {
      const otro = t.plan === "premium" ? "free" : "premium";
      const tr = document.createElement("tr");
      tr.innerHTML =
        `<td>${t.nombre}</td><td><code>${t.id}</code></td>` +
        `<td class="${t.plan}">${t.plan}</td><td>${t.miembros}</td>`;
      const td = document.createElement("td");
      const b = document.createElement("button");
      b.textContent = "→ " + otro;
      b.onclick = () => setPlan(t.id, otro);
      td.appendChild(b); tr.appendChild(td); tb.appendChild(tr);
    }
    const us = await api("/users");
    document.getElementById("users").textContent =
      us.length + ": " + us.join(", ");
  } catch (e) { flash("error: " + e.message, false); }
}

if (tok()) entrar();
</script>
</body>
</html>
