    <!--
      Tipografía REAL. El sistema de diseño referencia "Inter" y
      "JetBrains Mono" pero la landing corría con la fuente del sistema
      (el IDE sí las cargaba; la landing no — la mejora de calidad
      percibida más grande por línea tocada). Carga en runtime con
      preconnect para no bloquear y display=swap; si la red falla, el
      stack de sistema en los tokens toma el relevo sin romper nada.
      Inter va como fuente VARIABLE con eje óptico (opsz) para que los
      titulares respiren y el cuerpo quede nítido.
    -->
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      rel="stylesheet"
      href="https://fonts.googleapis.com/css2?family=Inter:opsz,wght@14..32,400..700&family=JetBrains+Mono:wght@400;500;600;700&display=swap"
    />

    <!-- Pinta el fondo profundo antes de que cargue el CSS: cero flash. -->
    <style>
      html, body { background: #08090b; }
    </style>

    <!--
      Ajusta <html lang> ANTES del paint si el usuario tiene preferencia
      guardada (ES por defecto). Evita el "flash" de SEO/a11y donde el
      crawler ve es-ES sobre contenido EN. Aislado en try/catch porque
      localStorage puede no existir (modo privado / SSR).
    -->
    <script>
      try {
        var l = localStorage.getItem("orux_lang");
        if (l === "en" || l === "es") document.documentElement.lang = l;
      } catch (e) {}
    </script>
