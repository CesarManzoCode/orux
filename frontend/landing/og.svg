<?xml version="1.0" encoding="UTF-8"?>
<!--
  Open Graph image (1200x630) para shares en Twitter/X/HN/LinkedIn/Slack.
  Dirección de arte: "Infraestructura / Sala de control" (ver landing/css/base.css).
  Acero #5d7fa6 + base #070809 + verde --live solo donde hay vida coordinada.

  Versión inicial — pensada para iterar. El SVG es el source editable; el PNG
  exportado vive en public/og.png y es lo que sirve Caddy en orux.space/og.png.
-->
<svg xmlns="http://www.w3.org/2000/svg"
     viewBox="0 0 1200 630"
     width="1200" height="630">
  <defs>
    <!-- Gradiente plateado mate del logomark — copia del docs/img/logomark-source.svg
         para mantener la marca consistente entre landing, OG y app. -->
    <linearGradient id="silverA" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#FFFFFF"/>
      <stop offset="45%" stop-color="#C8C8CC"/>
      <stop offset="100%" stop-color="#6E6E72"/>
    </linearGradient>
    <!-- Patrón de rejilla sutil: hairlines casi invisibles, dan textura
         tipo "plano arquitectónico" sin gritar. Mismo --hair de base.css. -->
    <pattern id="grid" x="0" y="0" width="60" height="60" patternUnits="userSpaceOnUse">
      <path d="M 60 0 L 0 0 0 60" fill="none"
            stroke="rgba(255,255,255,0.045)" stroke-width="1"/>
    </pattern>
  </defs>

  <!-- Fondo: negro frío + grid -->
  <rect width="1200" height="630" fill="#070809"/>
  <rect width="1200" height="630" fill="url(#grid)"/>

  <!-- Ejes mayores casi imperceptibles (refuerzan "estructura") -->
  <line x1="0" y1="200" x2="1200" y2="200" stroke="#14161c" stroke-width="1"/>
  <line x1="0" y1="430" x2="1200" y2="430" stroke="#14161c" stroke-width="1"/>
  <line x1="680" y1="0" x2="680" y2="630" stroke="#14161c" stroke-width="1"/>

  <!-- Top-right: indicador "EN VIVO" — el único verde de la imagen, en una
       sola escena. Es la diferenciación que la marca pinta como significado:
       --live = vivo/coordinado. Pequeño, no decoración. -->
  <g transform="translate(1010, 50)">
    <circle cx="0" cy="0" r="5" fill="#43b98a"/>
    <circle cx="0" cy="0" r="9" fill="none" stroke="#43b98a"
            stroke-width="1" opacity="0.35"/>
    <text x="16" y="5"
          font-family="'Inter','Liberation Sans','Helvetica',sans-serif"
          font-size="12" font-weight="700"
          fill="#747a89" letter-spacing="2.6">
      EN VIVO · ORUX.SPACE
    </text>
  </g>

  <!-- ────────── Columna izquierda: marca + tagline ────────── -->

  <!-- Logomark hexafoil grande (6 lentes a 60° + punto central) -->
  <g transform="translate(110, 175) scale(2.7)"
     fill="none" stroke="url(#silverA)"
     stroke-width="2.2" stroke-linejoin="round">
    <path d="M0 -22 Q12 -8 0 0 Q-12 -8 0 -22 Z"/>
    <g transform="rotate(60)">
      <path d="M0 -22 Q12 -8 0 0 Q-12 -8 0 -22 Z"/>
    </g>
    <g transform="rotate(120)">
      <path d="M0 -22 Q12 -8 0 0 Q-12 -8 0 -22 Z"/>
    </g>
    <g transform="rotate(180)">
      <path d="M0 -22 Q12 -8 0 0 Q-12 -8 0 -22 Z"/>
    </g>
    <g transform="rotate(240)">
      <path d="M0 -22 Q12 -8 0 0 Q-12 -8 0 -22 Z"/>
    </g>
    <g transform="rotate(300)">
      <path d="M0 -22 Q12 -8 0 0 Q-12 -8 0 -22 Z"/>
    </g>
    <circle cx="0" cy="0" r="2.5" fill="url(#silverA)" stroke="none"/>
  </g>

  <!-- Wordmark Orux — tinta sólida, tracking apretado a la izquierda.
       La autoridad la da la escala, no el color (regla de la dirección). -->
  <text x="80" y="370"
        font-family="'Inter','Liberation Sans','Helvetica',sans-serif"
        font-size="118" font-weight="800"
        fill="#edeff3" letter-spacing="-4">Orux</text>

  <!-- Underline acero — pequeña marca de identidad, NO decoración -->
  <rect x="80" y="388" width="76" height="3" fill="#5d7fa6"/>

  <!-- Tagline corto (dos líneas) -->
  <text x="80" y="440"
        font-family="'Inter','Liberation Sans','Helvetica',sans-serif"
        font-size="26" font-weight="500" fill="#a9afbc">
    Coordinación de código en tiempo real
  </text>
  <text x="80" y="475"
        font-family="'Inter','Liberation Sans','Helvetica',sans-serif"
        font-size="26" font-weight="500" fill="#a9afbc">
    sobre Git.
  </text>

  <text x="80" y="525"
        font-family="'Inter','Liberation Sans','Helvetica',sans-serif"
        font-size="18" font-weight="500" fill="#747a89">
    Para equipos de 2 a 50 devs.
  </text>

  <!-- ────────── Columna derecha: las tres preguntas que resuelve ────────── -->
  <!-- Mismo copy que og:title ("Quién toca qué. De quién es. Qué rompe.")
       descompuesto en 3 chips: cada uno con su color de significado
       (peer/steel/risk) para dejar VER lo que pinta la marca. -->

  <g transform="translate(740, 215)">
    <!-- Chip 1: peer azul = "otra persona" -->
    <rect x="0" y="0" width="380" height="60" rx="6"
          fill="#0e1014" stroke="#20242c" stroke-width="1"/>
    <circle cx="28" cy="30" r="4.5" fill="#6ea8e6"/>
    <text x="50" y="38"
          font-family="'Inter','Liberation Sans','Helvetica',sans-serif"
          font-size="22" font-weight="600" fill="#edeff3">Quién toca qué.</text>

    <!-- Chip 2: steel acero = identidad/ownership -->
    <rect x="0" y="80" width="380" height="60" rx="6"
          fill="#0e1014" stroke="#20242c" stroke-width="1"/>
    <circle cx="28" cy="110" r="4.5" fill="#5d7fa6"/>
    <text x="50" y="118"
          font-family="'Inter','Liberation Sans','Helvetica',sans-serif"
          font-size="22" font-weight="600" fill="#edeff3">De quién es.</text>

    <!-- Chip 3: risk ámbar = impacto/algo a revisar -->
    <rect x="0" y="160" width="380" height="60" rx="6"
          fill="#0e1014" stroke="#20242c" stroke-width="1"/>
    <circle cx="28" cy="190" r="4.5" fill="#d6a341"/>
    <text x="50" y="198"
          font-family="'Inter','Liberation Sans','Helvetica',sans-serif"
          font-size="22" font-weight="600" fill="#edeff3">Qué rompe.</text>
  </g>

  <!-- Pie: eyebrow técnico estilo monoespaciado, sin emojis ni promesas -->
  <text x="80" y="585"
        font-family="'JetBrains Mono','Liberation Mono','Menlo',monospace"
        font-size="12" font-weight="700"
        fill="#747a89" letter-spacing="2.6">
    CAPA DE COORDINACIÓN · MULTI-LENGUAJE · TIEMPO REAL
  </text>
</svg>
