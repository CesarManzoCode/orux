<!doctype html>
<html lang="es">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="color-scheme" content="dark" />
    <meta name="theme-color" content="#050608" />
    <title>Orux</title>

    <!-- Favicon: la marca hexafoil (solo la figura, sin wordmark). SVG
         para que escale nítido en cualquier densidad de pantalla. URL
         relativa porque la app vive en /app/ (vite base="/app/"); con
         "/favicon.svg" absoluto apuntaría a la raíz del dominio, no al
         público de esta app. -->
    <link rel="icon" type="image/svg+xml" href="./favicon.svg" />

    <!--
      Tipografía REAL ahora SELF-HOSTED.
      AUDITORIA-SEGURIDAD 2026-05-25 A-INF-02: antes cargaba de Google
      Fonts (filtra IP+UA+Referer al hacer la request). Ahora vive como
      dependencia npm (`@fontsource-variable/inter` +
      `@fontsource/jetbrains-mono`); el bundler la sirve desde nuestro
      propio origen. El @import vive en `src/main.tsx`.
    -->

    <!-- Pinta el fondo profundo antes de que cargue el CSS: cero flash. -->
    <style>
      html, body { background: #050608; }
    </style>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
