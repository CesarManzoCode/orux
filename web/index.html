<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8" />
  <title>laidea</title>
  <link rel="stylesheet" href="styles.css" />
  <!--
    Capa 11: primera dependencia real (Prism.js), por el gatillo acordado: un
    usuario real (devs de TypeScript) chocó con el resaltado mono-lenguaje.
    Se vendoriza en web/vendor/prism.js (lo sirve Caddy). Si el archivo no
    está, window.Prism queda undefined y el cliente cae al resaltador vanilla
    de antes (degradación elegante: NO se rompe nada sin el archivo). NO se
    carga el theme de Prism a propósito: los colores los pone NUESTRO CSS
    sobre las clases .token.* — así Prism solo tokeniza y la métrica del
    editor (line-height/padding, contrato de presencia) queda intacta.
  -->
  <script src="vendor/prism.js"></script>
</head>
<body>
  <div id="login">
    <div class="card">
      <div class="marca">la<b>idea</b></div>
      <p>Entrá con tu usuario o creá uno nuevo. La app está cerrada: sin cuenta no se ve el workspace.</p>
      <input id="u" placeholder="usuario" autocomplete="username" autofocus />
      <input id="p" type="password" placeholder="contraseña" autocomplete="current-password" />
      <div class="fila">
        <button id="entrar">entrar</button>
        <button id="crear">crear cuenta</button>
      </div>
      <div class="err" id="loginErr"></div>
    </div>
  </div>

  <header class="isla">
    <div class="mark">▣</div>
    <h1>la<b>idea</b></h1>
    <span class="chev">›</span>
    <span class="proy" id="proy">workspace</span>
    <span class="sep"></span>
    <span id="status">conectando...</span>
    <span id="yo"></span>
    <span id="salir" style="display:none;">salir</span>
  </header>

  <div class="layout">
    <nav id="rail" class="isla">
      <button data-vista="archivos" class="activo" title="archivos">🗂</button>
      <button data-vista="git" title="git">⎇</button>
      <button data-vista="admin" title="admin" style="display:none;">🛡</button>
      <span class="esp"></span>
    </nav>
    <aside class="isla">
      <div class="vista on" data-vista="archivos">
        <h2>archivos</h2>
        <button id="nuevo">+ nuevo archivo</button>
        <ul id="lista"></ul>
      </div>
      <div class="vista" data-vista="git">
        <h2>control de versiones</h2>
        <div id="git"></div>
      </div>
    </aside>
    <main class="isla">
      <div id="tabs"><span class="vacio">sin archivo abierto</span></div>
      <div id="cabecera">
        <span id="actual" hidden></span>
        <span id="aqui"></span>
        <span id="owner"></span>
        <button id="reclamar" style="display:none;">reclamar este archivo</button>
      </div>
      <div id="propuestas"></div>
      <div id="impactos"></div>
      <div id="aviso"></div>
      <div class="editor-wrap off" id="wrap">
        <div id="lineaActiva"></div>
        <pre id="resaltado" aria-hidden="true"><code></code></pre>
        <div id="capa-presencia"><div id="capa-scroll"></div></div>
        <textarea id="editor" placeholder="selecciona un archivo o crea uno nuevo" spellcheck="false" disabled></textarea>
        <div id="gutter" aria-hidden="true"><div id="gutter-scroll"></div></div>
      </div>
    </main>
  </div>

  <footer id="statusbar" class="isla">
    <span class="sb" id="sb-git"></span>
    <span class="esp"></span>
    <span class="sb" id="sb-lang"></span>
    <span class="sep">·</span>
    <span class="sb" id="sb-yo"></span>
  </footer>

  <!--
    Capa 13: panel admin con su PROPIO espacio (ya no en la sidebar). La
    primera queja real: repartir owners archivo-por-archivo en 100 archivos
    es inusable. Acá: árbol con checkboxes, seleccionás archivos o carpetas
    enteras, elegís el dueño UNA vez, aplicás al lote. Lo llena admin.js.
  -->
  <div id="adminmodal">
    <div class="amcard">
      <div class="amhead">
        <span class="amtit">administración · ownership</span>
        <button class="amx" id="amCerrar" title="cerrar">✕</button>
      </div>
      <div class="ambar">
        <label class="amsel">
          dueño:
          <select id="amUser"></select>
        </label>
        <span class="amcount" id="amCount">0 seleccionados</span>
        <span class="esp"></span>
        <button id="amTodos">todo</button>
        <button id="amNada">nada</button>
        <button id="amAplicar" class="amgo" disabled>asignar a 0</button>
        <button id="amQuitar" class="amno" disabled>quitar dueño a 0</button>
      </div>
      <div class="amtree" id="amTree"></div>
      <div class="amfoot" id="amFoot"></div>
    </div>
  </div>

  <script src="app.js"></script>
  <script src="admin.js"></script>
</body>
</html>
