<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8" />
  <title>laidea</title>
  <style>
    /*
     * Sistema de diseño. Todo sale de tokens (:root): cambiar un color o un
     * espaciado se hace en UN lugar. Chrome en tipografía de sistema (se ve
     * profesional); monoespaciado SOLO donde es código (editor, diff, log).
     * Sin frameworks ni dependencias: es CSS, no basura.
     */
    :root {
      --bg-deep: #08090b;     /* lienzo detrás de las islas (lo más oscuro) */
      --bg: #0d0e11;          /* fondo dentro de un panel */
      --surface: #141518;     /* islas: header, rail, sidebar, main */
      --surface-2: #1c1d21;   /* inputs, hover, chips */
      --elevated: #212227;    /* lo que flota encima */
      --border: #2b2c33;      /* bordes visibles */
      --border-soft: #202127; /* divisores tenues */
      --text: #e9e9ec;        /* texto principal */
      --muted: #8b8d96;       /* secundario */
      --faint: #5a5c64;       /* terciario / hints */
      --accent: #4cc38a;      /* color de marca (verde calmo) */
      --accent-weak: rgba(76,195,138,0.13);
      --ok: #56d98a; --ok-bg: #143626;
      --warn: #e3b341; --warn-bg: #3a2e14;
      --bad: #f0707a; --bad-bg: #3d1a1f;
      --info: #6cb6ff; --info-bg: #16202b;
      --r: 7px; --r-sm: 5px; --r-isla: 10px;
      --font-ui: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto,
        Inter, system-ui, sans-serif;
      --font-mono: ui-monospace, "JetBrains Mono", SFMono-Regular, Menlo,
        Consolas, monospace;
      --t: 120ms ease;
    }
    * { box-sizing: border-box; }
    /*
     * Lienzo "Islands": el fondo es lo más oscuro y cada región (topbar,
     * layout, statusbar) flota como una isla redondeada con un hueco entre
     * medio. Es lo que hace que se lea como IDE moderno y no como prototipo.
     * El padding/gap del body crea esos huecos sin tocar nada interno.
     */
    body {
      font-family: var(--font-ui);
      margin: 0;
      padding: 6px;
      gap: 6px;
      background: var(--bg-deep);
      color: var(--text);
      height: 100vh;
      display: flex;
      flex-direction: column;
      font-size: 13px;
      -webkit-font-smoothing: antialiased;
    }
    /* Toda isla comparte el mismo lenguaje: superficie, radio, borde tenue. */
    .isla {
      background: var(--surface);
      border: 1px solid var(--border-soft);
      border-radius: var(--r-isla);
    }
    /* Scrollbars discretas, coherentes con el tema. */
    *::-webkit-scrollbar { width: 9px; height: 9px; }
    *::-webkit-scrollbar-thumb {
      background: var(--border); border-radius: 6px;
      border: 2px solid transparent; background-clip: padding-box;
    }
    *::-webkit-scrollbar-thumb:hover { background: #3a3b43; background-clip: padding-box; }
    *::-webkit-scrollbar-track { background: transparent; }
    :focus-visible { outline: 2px solid var(--accent); outline-offset: 1px; }
    button { transition: background var(--t), border-color var(--t), color var(--t); }
    header {
      padding: 0.5rem 0.85rem;
      display: flex;
      align-items: center;
      gap: 0.7rem;
      flex-shrink: 0;
    }
    /* Marca cuadrada tipo "logo de IDE" (▣). Pequeña, deliberada. */
    header .mark {
      width: 22px; height: 22px; border-radius: 6px; flex-shrink: 0;
      background: var(--accent); color: #06120c;
      display: grid; place-items: center;
      font-size: 13px; font-weight: 900;
    }
    header h1 {
      margin: 0; font-size: 13.5px; font-weight: 650;
      letter-spacing: -0.01em; color: var(--text);
    }
    header h1 b { color: var(--accent); font-weight: 700; }
    /* Breadcrumb "laidea › proyecto", como la barra de título de un IDE. */
    header .chev { color: var(--faint); font-size: 12px; }
    header .proy {
      color: var(--muted); font-size: 12.5px; font-weight: 600;
      font-family: var(--font-mono);
    }
    #status {
      padding: 0.2rem 0.55rem;
      border-radius: 999px;
      font-size: 11px; font-weight: 600;
      background: var(--surface-2);
      color: var(--muted);
      display: inline-flex; align-items: center; gap: 0.35rem;
    }
    #status::before {
      content: ""; width: 6px; height: 6px; border-radius: 50%;
      background: currentColor;
    }
    #status.ok { background: var(--ok-bg); color: var(--ok); }
    #status.bad { background: var(--bad-bg); color: var(--bad); }
    #yo { color: var(--muted); }
    #yo b { color: var(--text); }
    header .sep { flex: 1; }
    .layout { flex: 1; display: flex; min-height: 0; gap: 6px; }

    /* Barra de actividad (rail): tira vertical de íconos, como en todo IDE.
       Cambia qué panel muestra el sidebar (archivos / git / admin). Es
       navegación, no una feature: no agrega capacidades, organiza las que
       ya hay. El de admin solo aparece si sos admin (capa 12). */
    #rail {
      width: 44px; flex-shrink: 0;
      display: flex; flex-direction: column; align-items: center;
      gap: 4px; padding: 6px 0;
    }
    #rail button {
      width: 32px; height: 32px; border: none; border-radius: 8px;
      background: transparent; color: var(--faint);
      cursor: pointer; font-size: 15px; line-height: 1;
      display: grid; place-items: center;
      position: relative;
    }
    #rail button:hover { background: var(--surface-2); color: var(--muted); }
    #rail button.activo { background: var(--accent-weak); color: var(--accent); }
    #rail button.activo::before {
      content: ""; position: absolute; left: -6px; top: 6px; bottom: 6px;
      width: 2px; border-radius: 2px; background: var(--accent);
    }
    #rail .esp { flex: 1; }

    aside {
      width: 248px; flex-shrink: 0;
      padding: 0.85rem;
      overflow-y: auto;
      display: flex;
      flex-direction: column;
      gap: 0.6rem;
    }
    /* Solo se muestra el panel de la vista activa (lo decide el rail). */
    aside > .vista { display: none; flex-direction: column; gap: 0.6rem; }
    aside > .vista.on { display: flex; }
    aside h2 {
      margin: 0.15rem 0.1rem;
      font-size: 10px;
      font-weight: 700;
      text-transform: uppercase;
      letter-spacing: 0.08em;
      color: var(--faint);
    }
    #nuevo {
      background: var(--surface-2);
      color: var(--text);
      border: 1px solid var(--border);
      border-radius: var(--r-sm);
      padding: 0.5rem 0.7rem;
      font-family: inherit;
      font-size: 12.5px; font-weight: 600;
      cursor: pointer;
      text-align: left;
    }
    #nuevo:hover { background: var(--elevated); border-color: #3a3b43; }
    #lista { list-style: none; margin: 0; padding: 0; display: flex; flex-direction: column; gap: 1px; }
    /* Fila: nombre a la izquierda, puntos de presencia a la derecha. */
    #lista li {
      display: flex; align-items: center; justify-content: space-between;
      gap: 0.5rem;
      padding: 0.4rem 0.55rem;
      border-radius: var(--r-sm);
      cursor: pointer;
      font-size: 12.5px;
      color: var(--muted);
      transition: background var(--t), color var(--t);
    }
    #lista li:hover { background: var(--surface-2); color: var(--text); }
    #lista li.activo {
      background: var(--accent-weak); color: var(--text);
      box-shadow: inset 2px 0 0 var(--accent);
    }
    /* Árbol de carpetas (capa de pulido). dir = carpeta colapsable. */
    #lista li.dir { justify-content: flex-start; gap: 0.3rem; color: var(--text); }
    #lista li.dir .car {
      width: 0.8em; flex-shrink: 0; color: var(--faint); font-size: 10px;
    }
    #lista li.dir .dnombre { font-weight: 600; }
    #lista li.file .fnombre,
    #lista li.dir .dnombre {
      overflow: hidden; text-overflow: ellipsis; white-space: nowrap;
    }
    #lista li.file .fnombre { flex: 1; }
    #lista li.vacio { color: var(--faint); cursor: default; font-style: italic; }
    #lista li.vacio:hover { background: transparent; color: var(--faint); }
    .badges { display: flex; gap: 3px; flex-shrink: 0; }
    .badge {
      width: 17px; height: 17px; border-radius: 50%;
      font-size: 9px; line-height: 17px; text-align: center;
      color: #0d0e11; font-weight: 800;
      box-shadow: 0 0 0 2px var(--surface);
    }
    #lista li .der { display: flex; align-items: center; gap: 0.4rem; flex-shrink: 0; }
    .del-x {
      border: none; background: transparent; color: var(--faint);
      cursor: pointer; font-size: 11px; line-height: 1; padding: 2px 4px;
      border-radius: var(--r-sm); opacity: 0;
      transition: opacity var(--t), color var(--t), background var(--t);
    }
    #lista li:hover .del-x { opacity: 1; }
    .del-x:hover { color: var(--bad); background: var(--bad-bg); }
    main {
      flex: 1; display: flex; flex-direction: column; min-width: 0;
      overflow: hidden;   /* las esquinas redondeadas de la isla recortan */
    }

    /* Chip de tipo de archivo (py / ts / go …): señal de IDE barata y de
       alto impacto visual. Se usa en la lista y en la pestaña. El color lo
       pone una clase t-xxx; los desconocidos caen al gris neutro. */
    .ti {
      flex-shrink: 0; font-family: var(--font-mono);
      font-size: 9.5px; font-weight: 800; line-height: 1;
      padding: 3px 4px; border-radius: 4px; min-width: 20px;
      text-align: center; text-transform: lowercase;
      background: var(--surface-2); color: var(--muted);
    }
    .ti.t-py  { background: #1d2b1f; color: #6cd08a; }
    .ti.t-js  { background: #2e2a14; color: #e3c14a; }
    .ti.t-ts  { background: #142436; color: #5aa6ef; }
    .ti.t-go  { background: #112b30; color: #56cfd9; }
    .ti.t-rs  { background: #2e1d14; color: #e0905f; }
    .ti.t-java{ background: #2e1a14; color: #e08a5f; }
    .ti.t-cpp { background: #1a2336; color: #7aa6f0; }
    .ti.t-md  { background: #1f2026; color: #9aa0ad; }
    .ti.t-cfg { background: #251f2e; color: #b58bd0; }

    /* Pestañas de archivo. Minimal: la del archivo abierto (con ícono de
       tipo y ✕). Es chrome, no gestión multi-pestaña (eso era otro nivel). */
    #tabs {
      display: flex; align-items: stretch; gap: 4px;
      padding: 6px 6px 0;
      background: var(--bg);
      border-bottom: 1px solid var(--border-soft);
      min-height: 36px;
    }
    #tabs .vacio {
      color: var(--faint); font-size: 12px; padding: 0.5rem 0.6rem;
    }
    .tab {
      display: flex; align-items: center; gap: 0.45rem;
      padding: 0.4rem 0.5rem 0.4rem 0.6rem;
      background: var(--surface); color: var(--text);
      border: 1px solid var(--border-soft); border-bottom: none;
      border-radius: 7px 7px 0 0; font-size: 12.5px;
      font-family: var(--font-mono); max-width: 240px;
    }
    .tab .nom { overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
    .tab .tabx {
      border: none; background: transparent; color: var(--faint);
      cursor: pointer; font-size: 12px; line-height: 1;
      padding: 2px 3px; border-radius: 4px; flex-shrink: 0;
    }
    .tab .tabx:hover { color: var(--bad); background: var(--bad-bg); }

    /* Barra de contexto del archivo (dueño / presencia / reclamar). Antes
       mostraba el nombre; ahora la pestaña lo dice, así que esto queda fino
       y solo con el estado de coordinación. */
    #cabecera {
      padding: 0.45rem 1rem;
      border-bottom: 1px solid var(--border-soft);
      background: var(--surface);
      font-size: 12px;
      color: var(--muted);
      display: flex; align-items: center; gap: 0.8rem;
      min-height: 34px;
    }
    #cabecera #actual {
      color: var(--text); font-weight: 600;
      font-family: var(--font-mono); font-size: 12.5px;
    }

    /* Barra de estado (isla inferior): rama · cambios · lenguaje · identidad.
       Otra señal fuerte de "herramienta real". Solo lee estado que ya existe
       (git, archivo abierto, usuario). */
    #statusbar {
      flex-shrink: 0; display: flex; align-items: center; gap: 0.5rem;
      padding: 0.3rem 0.85rem; font-size: 11px; color: var(--muted);
      min-height: 26px;
    }
    #statusbar .sb { display: inline-flex; align-items: center; gap: 0.35rem; }
    #statusbar .sep { color: var(--faint); }
    #statusbar .pt { width: 7px; height: 7px; border-radius: 50%; }
    #statusbar b { color: var(--text); font-weight: 600; }
    #statusbar .esp { flex: 1; }
    /* Quién más está en ESTE archivo, con su línea. Redundante con los
       marcadores del editor a propósito: si su línea está fuera de pantalla,
       igual sabés que está acá. */
    #aqui { display: flex; gap: 0.4rem; flex-wrap: wrap; }
    #aqui .quien {
      font-size: 11px; padding: 0.12rem 0.5rem; border-radius: 999px;
      color: #0d0e11; font-weight: 700;
    }
    /*
     * El editor y la capa de presencia comparten exactamente la misma métrica
     * (font, tamaño, line-height en px, padding). Solo así la línea N del
     * textarea cae en el mismo pixel que el marcador de la línea N. Por eso
     * line-height va en px fijos y el textarea no envuelve líneas (white-space:
     * pre): así "línea lógica" == "fila visual" y el mapeo línea->pixel es exacto.
     */
    .editor-wrap { flex: 1; position: relative; display: flex; min-height: 0; background: var(--surface); }
    .editor-wrap.off { background: var(--bg); }
    /* La capa de presencia va ENCIMA del textarea (z-index 2) con
       pointer-events:none: se ve clarísima sin estorbar al teclear. Antes
       estaba detrás y a 13% de opacidad — invisible sobre fondo oscuro. */
    #capa-presencia {
      position: absolute; inset: 0;
      overflow: hidden; pointer-events: none; z-index: 2;
    }
    /* Se desplaza verticalmente junto con el scroll del textarea (translateY).
       Horizontal no hace falta: las marcas son de ancho completo y la etiqueta
       va anclada al borde derecho visible. */
    #capa-scroll { position: absolute; left: 0; right: 0; top: 0; }
    .marca { position: absolute; left: 0; right: 0; height: 22px; }
    /* Tinte tenue de toda la fila: da el "alguien está en esta línea" sin
       tapar el texto. */
    .marca .tinte { position: absolute; inset: 0; opacity: 0.16; }
    /* Línea nítida de 2px centrada en la fila: el marcador real, legible. */
    .marca .raya {
      position: absolute; left: 0; right: 0; top: 50%;
      height: 2px; transform: translateY(-50%);
    }
    /* Nombre anclado a la derecha: nunca choca con el código y siempre se lee. */
    .marca .etiqueta {
      position: absolute; right: 8px; top: 50%; transform: translateY(-50%);
      font-size: 10px; padding: 1px 7px; border-radius: 999px;
      color: #0d0e11; font-weight: 800; white-space: nowrap;
      font-family: var(--font-ui);
    }
    /* El texto del textarea va TRANSPARENTE: se ve el <pre> coloreado de
       atrás (#resaltado). El caret y la selección sí se ven. Misma técnica
       que el overlay de presencia; el textarea sigue siendo el editor real
       (no se reemplaza), así presencia/locks/tentativo siguen igual. */
    textarea {
      flex: 1;
      position: relative; z-index: 1;
      background: transparent;
      color: transparent;
      -webkit-text-fill-color: transparent;
      caret-color: var(--text);
      border: none;
      font-family: var(--font-mono);      /* código: SIEMPRE monoespaciado */
      font-size: 14px;
      line-height: 22px;                  /* px fijos: clave para alinear marcas */
      padding: 20px 24px 20px 64px;   /* left = ancho del gutter (52) + aire */                 /* idem: LINE_H/PAD_TOP del JS dependen de esto */
      resize: none;
      outline: none;
      white-space: pre;                   /* sin wrap: 1 línea lógica = 1 fila */
      overflow: auto;
      tab-size: 4;
    }
    textarea::selection { background: rgba(76,195,138,0.28); }
    textarea::placeholder {
      color: var(--faint); -webkit-text-fill-color: var(--faint);
    }
    /* Capa de resaltado: idéntica métrica al textarea (clave para que cada
       glifo caiga en su pixel, igual contrato que LINE_H/PAD_TOP). Detrás
       del textarea (z 0) y del overlay de presencia (z 2). */
    #resaltado {
      position: absolute; inset: 0; margin: 0; z-index: 0;
      overflow: hidden; pointer-events: none;
      font-family: var(--font-mono); font-size: 14px; line-height: 22px;
      padding: 20px 24px 20px 64px;   /* left = ancho del gutter (52) + aire */ white-space: pre; tab-size: 4;
      color: var(--text); background: transparent;
    }
    #resaltado code {
      display: block; font: inherit;
      will-change: transform;
    }
    .tk-kw { color: #c98bdb; }       /* keywords */
    .tk-def { color: #4cc38a; font-weight: 600; }  /* nombre de def/class */
    .tk-str { color: #e3b341; }      /* strings */
    .tk-com { color: var(--faint); font-style: italic; }  /* comentarios */
    .tk-num { color: #e0905f; }      /* números */
    .tk-bi  { color: #6cb6ff; }      /* builtins */
    .tk-dec { color: #56d98a; }      /* decoradores */

    /* Colores para los tokens de Prism (capa 11). NO usamos el theme de
       Prism: solo sus clases .token.*, con NUESTRA paleta. El <pre>#resaltado
       conserva su font/line-height/padding (contrato con presencia). */
    #resaltado .token.comment,
    #resaltado .token.prolog,
    #resaltado .token.doctype,
    #resaltado .token.cdata { color: var(--faint); font-style: italic; }
    #resaltado .token.punctuation { color: var(--muted); }
    #resaltado .token.keyword,
    #resaltado .token.boolean,
    #resaltado .token.important,
    #resaltado .token.atrule { color: #c98bdb; }
    #resaltado .token.string,
    #resaltado .token.char,
    #resaltado .token.attr-value,
    #resaltado .token.regex { color: #e3b341; }
    #resaltado .token.number,
    #resaltado .token.unit { color: #e0905f; }
    #resaltado .token.function,
    #resaltado .token.class-name,
    #resaltado .token.maybe-class-name { color: #4cc38a; }
    #resaltado .token.builtin,
    #resaltado .token.tag,
    #resaltado .token.selector,
    #resaltado .token.attr-name,
    #resaltado .token.property,
    #resaltado .token.constant,
    #resaltado .token.symbol { color: #6cb6ff; }
    #resaltado .token.operator,
    #resaltado .token.entity,
    #resaltado .token.url { color: var(--text); }
    #resaltado .token.decorator,
    #resaltado .token.namespace { color: #56d98a; }
    #resaltado .token.deleted { color: var(--bad); }
    #resaltado .token.inserted { color: var(--ok); }

    /* Gutter de números de línea: columna fija a la izquierda, misma métrica
       que el textarea (PAD_TOP=20, LINE_H=22) para que el número N quede
       frente a la línea N. z-index 3 = tapa limpio el tinte de presencia en
       su franja. pointer-events:none → los clics caen en el textarea. */
    #gutter {
      position: absolute; left: 0; top: 0; bottom: 0; width: 52px;
      overflow: hidden; pointer-events: none; z-index: 3;
      background: var(--surface); border-right: 1px solid var(--border-soft);
      font-family: var(--font-mono); font-size: 14px; line-height: 22px;
    }
    #gutter-scroll {
      padding: 20px 10px 0 0; text-align: right;
      color: var(--faint); white-space: pre; will-change: transform;
    }
    /* Línea actual: banda tenue a lo ancho. z-index 0 + va ANTES de
       #resaltado en el DOM → el código (texto opaco) se pinta encima y la
       banda se ve en los huecos, como en un editor de verdad. */
    #lineaActiva {
      position: absolute; left: 52px; right: 0; height: 22px;
      background: rgba(255,255,255,0.035); z-index: 0;
      pointer-events: none; display: none;
    }
    .editor-wrap.off #gutter,
    .editor-wrap.off #lineaActiva { display: none; }

    /* --- Capa 4: ownership --- */
    #owner { font-size: 11px; }
    #owner .tag {
      padding: 0.14rem 0.55rem; border-radius: 999px; font-weight: 700;
      font-size: 11px;
    }
    #owner .tuyo { background: var(--ok-bg); color: var(--ok); }
    #owner .ajeno { background: var(--warn-bg); color: var(--warn); }
    #reclamar {
      background: var(--surface-2); color: var(--text); border: 1px solid var(--border);
      border-radius: var(--r-sm); padding: 0.22rem 0.65rem; font-family: inherit;
      font-size: 11px; font-weight: 600; cursor: pointer;
    }
    #reclamar:hover { background: var(--elevated); border-color: #3a3b43; }
    /* Aviso al autor de un cambio tentativo: tocás código ajeno; lo que
       escribas se PROPONE, no se aplica. Honesto y visible, no bloqueante. */
    #aviso {
      display: none; padding: 0.55rem 1.25rem; font-size: 12px;
      background: var(--warn-bg); color: var(--warn);
      border-bottom: 1px solid var(--border-soft);
    }
    #aviso.on { display: block; }
    /* Bandeja del dueño: propuestas que esperan su verde/rojo. */
    #propuestas { display: none; border-bottom: 1px solid var(--border-soft); background: var(--surface); }
    #propuestas.on { display: block; }
    #propuestas h3, #impactos h3 {
      margin: 0; padding: 0.5rem 1.25rem; font-size: 10px; text-transform: uppercase;
      letter-spacing: 0.08em; font-weight: 700; color: var(--muted);
      background: var(--bg); border-bottom: 1px solid var(--border-soft);
    }
    .prop { padding: 0.8rem 1.25rem; border-top: 1px solid var(--border-soft); }
    .prop:first-of-type { border-top: none; }
    .prop .cab { display: flex; align-items: center; gap: 0.75rem; margin-bottom: 0.55rem; }
    .prop .cab .quien { font-size: 12.5px; color: var(--text); }
    .prop .cab .quien b { color: var(--warn); font-weight: 700; }
    .prop .acc { margin-left: auto; display: flex; gap: 0.4rem; }
    .prop button {
      border: none; border-radius: var(--r-sm); padding: 0.3rem 0.8rem;
      font-family: inherit; font-size: 12px; font-weight: 700; cursor: pointer;
    }
    .prop .ok { background: var(--ok-bg); color: var(--ok); }

    /* Capa 6: avisos de impacto. "Cambiaron algo que tu archivo usa." Mismo
       patrón visual que la bandeja de propuestas, en azul para distinguir
       (esto NO pide acción de aprobar/rechazar, solo te entera). */
    #impactos { display: none; border-bottom: 1px solid var(--border-soft); background: var(--surface); }

    .imp:first-of-type { border-top: none; }
