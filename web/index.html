<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8" />
  <title>laidea — prototipo</title>
  <style>
    body {
      font-family: ui-monospace, SFMono-Regular, Menlo, monospace;
      max-width: 900px;
      margin: 2rem auto;
      padding: 1.5rem;
      background: #0e0e10;
      color: #e6e6e6;
    }
    h1 { font-weight: 500; margin: 0 0 0.25rem; }
    .sub { color: #888; font-size: 13px; margin-bottom: 1.5rem; }
    #status {
      display: inline-block;
      padding: 0.25rem 0.6rem;
      border-radius: 4px;
      font-size: 12px;
      margin-bottom: 0.75rem;
      background: #2a2a2e;
      color: #aaa;
    }
    #status.ok { background: #14442b; color: #8de0a8; }
    #status.bad { background: #4a1a1a; color: #f08c8c; }
    textarea {
      width: 100%;
      height: 500px;
      font-family: inherit;
      font-size: 14px;
      padding: 1rem;
      box-sizing: border-box;
      background: #18181b;
      color: #e6e6e6;
      border: 1px solid #2a2a2e;
      border-radius: 6px;
      resize: vertical;
      line-height: 1.5;
    }
    textarea:focus { outline: none; border-color: #4a4a52; }
  </style>
</head>
<body>
  <h1>laidea — capa cero</h1>
  <div class="sub">estado compartido en tiempo real · abre esta página en varias pestañas</div>
  <div id="status">conectando...</div>
  <textarea id="editor" placeholder="empieza a escribir..." spellcheck="false"></textarea>

  <script>
    const editor = document.getElementById("editor");
    const status = document.getElementById("status");
    const ws = new WebSocket("ws://localhost:8765");
    let applyingRemote = false;

    ws.onopen = () => {
      status.textContent = "conectado";
      status.className = "ok";
    };
    ws.onclose = () => {
      status.textContent = "desconectado";
      status.className = "bad";
    };
    ws.onerror = () => {
      status.textContent = "error de conexión";
      status.className = "bad";
    };

    ws.onmessage = (e) => {
      const data = JSON.parse(e.data);
      if (data.type === "init" || data.type === "update") {
        const start = editor.selectionStart;
        const end = editor.selectionEnd;
        applyingRemote = true;
        editor.value = data.content;
        applyingRemote = false;
        editor.selectionStart = start;
        editor.selectionEnd = end;
      }
    };

    editor.addEventListener("input", () => {
      if (applyingRemote) return;
      if (ws.readyState !== WebSocket.OPEN) return;
      ws.send(JSON.stringify({ type: "update", content: editor.value }));
    });
  </script>
</body>
</html>
